<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#EDEDED">
    <title>输入金额 - BoonLink</title>
    <link rel="stylesheet" href="/shared/css/common.css">
    <style>
        /* Note Input Card */
        .note-input-card {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 12px 10px;
            padding: 10px 12px;
            background: var(--bg-card);
            border-radius: 10px;
            box-shadow: var(--shadow-card);
            cursor: pointer;
            transition: background 0.2s;
        }

        .note-input-card:active {
            background: var(--bg-input);
        }

        .note-icon {
            font-size: 16px;
        }

        .note-content {
            flex: 1;
        }

        .note-label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 1px;
        }

        .note-value {
            font-size: 13px;
            color: var(--text-tertiary);
        }

        .note-value.has-note {
            color: var(--text-primary);
        }

        .note-arrow {
            font-size: 20px;
            color: var(--text-tertiary);
        }

        /* Modal - GPU accelerated */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            transition: background 0.2s ease-out, visibility 0s linear 0.2s;
            will-change: background;
        }

        .modal-overlay.show {
            visibility: visible;
            background: rgba(0, 0, 0, 0.4);
            transition: background 0.2s ease-out, visibility 0s linear 0s;
        }

        .modal-content {
            width: 100%;
            max-width: 428px;
            background: var(--bg-card);
            border-radius: 16px 16px 0 0;
            transform: translateY(100%);
            transition: transform 0.2s ease-out;
            will-change: transform;
        }

        .modal-overlay.show .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 16px;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
        }

        .modal-body {
            padding: 14px 16px;
        }

        .note-textarea {
            width: 100%;
            height: 80px;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            background: var(--bg-input);
            color: var(--text-primary);
        }

        .note-textarea:focus {
            outline: none;
            border-color: var(--accent-green);
        }

        .note-char-count {
            text-align: right;
            font-size: 11px;
            color: var(--text-tertiary);
            margin-top: 6px;
        }

        .note-quick-tags {
            margin-top: 12px;
        }

        .quick-tag-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .quick-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .quick-tag {
            padding: 6px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            font-size: 13px;
            color: var(--text-primary);
            cursor: pointer;
        }

        .quick-tag:active {
            background: var(--accent-green);
            border-color: var(--accent-green);
            color: white;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            padding: 12px 16px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom, 0));
            border-top: 1px solid var(--border-color);
        }

        .modal-footer .btn {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="app-header">
            <div class="header-left">
                <button class="icon-btn" onclick="goBack()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                </button>
            </div>
            <div class="header-title">付款</div>
            <div class="header-right"></div>
        </div>

        <!-- Merchant Info -->
        <div class="merchant-info">
            <div class="merchant-label">付款给</div>
            <div class="merchant-name" id="merchantName">PromptPay 商户</div>
        </div>

        <!-- Amount Display Card -->
        <div class="card" style="margin: 8px 12px; padding: 12px;">
            <div class="amount-input-section">
                <div class="amount-currency-label">THB</div>
                <div class="amount-value-large" id="amountDisplay">0</div>
            </div>
            <div class="amount-underline"></div>
            <div class="amount-hint" id="cryptoHint">
                ≈ 0.00 USDT
            </div>
        </div>

        <!-- Note/Remark Input -->
        <div class="note-input-card" onclick="openNoteModal()">
            <div class="note-icon">📝</div>
            <div class="note-content">
                <div class="note-label">添加备注</div>
                <div class="note-value" id="notePreview">点击添加商品描述（可选）</div>
            </div>
            <div class="note-arrow">›</div>
        </div>

        <!-- Note Modal -->
        <div class="modal-overlay" id="noteModal" onclick="closeNoteModal(event)">
            <div class="modal-content" onclick="event.stopPropagation()">
                <div class="modal-header">
                    <div class="modal-title">添加备注</div>
                    <button class="modal-close" onclick="closeNoteModal()">✕</button>
                </div>
                <div class="modal-body">
                    <textarea
                        id="noteInput"
                        class="note-textarea"
                        placeholder="例如：一份猪肉打抛饭、两杯泰式奶茶..."
                        maxlength="100"
                    ></textarea>
                    <div class="note-char-count"><span id="charCount">0</span>/100</div>
                    <div class="note-quick-tags">
                        <div class="quick-tag-label">快捷标签</div>
                        <div class="quick-tags">
                            <button class="quick-tag" onclick="addQuickTag('打抛饭')">打抛饭</button>
                            <button class="quick-tag" onclick="addQuickTag('泰式奶茶')">泰式奶茶</button>
                            <button class="quick-tag" onclick="addQuickTag('芒果糯米饭')">芒果糯米饭</button>
                            <button class="quick-tag" onclick="addQuickTag('冬阴功汤')">冬阴功汤</button>
                            <button class="quick-tag" onclick="addQuickTag('青木瓜沙拉')">青木瓜沙拉</button>
                            <button class="quick-tag" onclick="addQuickTag('椰子水')">椰子水</button>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="clearNote()">清除</button>
                    <button class="btn btn-primary" onclick="saveNote()">确定</button>
                </div>
            </div>
        </div>

        <!-- Spacer to push numpad to bottom -->
        <div style="flex-grow: 1; min-height: 10px;"></div>

        <!-- Number Pad -->
        <div class="numpad-container" id="numpadContainer">
            <!-- Collapse Handle -->
            <div class="numpad-handle" onclick="toggleKeyboard()">
                <div class="handle-bar"></div>
                <span class="handle-hint" id="handleHint">下滑收起键盘</span>
            </div>
            <!-- Token Selection (horizontal) -->
            <div class="token-selector">
                <div class="token-chip selected" data-token="USDT" onclick="selectToken('USDT')">
                    <span class="token-chip-icon">₮</span>
                    <span class="token-chip-name">USDT</span>
                </div>
                <div class="token-chip" data-token="USDC" onclick="selectToken('USDC')">
                    <span class="token-chip-icon">$</span>
                    <span class="token-chip-name">USDC</span>
                </div>
                <div class="token-chip" data-token="ETH" onclick="selectToken('ETH')">
                    <span class="token-chip-icon">◆</span>
                    <span class="token-chip-name">ETH</span>
                </div>
            </div>
            
            <div class="numpad-grid" id="numpadGrid">
                <button class="numpad-key" onclick="addDigit('1')">1</button>
                <button class="numpad-key" onclick="addDigit('2')">2</button>
                <button class="numpad-key" onclick="addDigit('3')">3</button>
                <button class="numpad-key" onclick="addDigit('4')">4</button>
                <button class="numpad-key" onclick="addDigit('5')">5</button>
                <button class="numpad-key" onclick="addDigit('6')">6</button>
                <button class="numpad-key" onclick="addDigit('7')">7</button>
                <button class="numpad-key" onclick="addDigit('8')">8</button>
                <button class="numpad-key" onclick="addDigit('9')">9</button>
                <button class="numpad-key" onclick="addDigit('.')">.</button>
                <button class="numpad-key" onclick="addDigit('0')">0</button>
                <button class="numpad-key delete" onclick="deleteDigit()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 4H8l-7 8 7 8h13a2 2 0 002-2V6a2 2 0 00-2-2z"/>
                        <line x1="18" y1="9" x2="12" y2="15"/>
                        <line x1="12" y1="9" x2="18" y2="15"/>
                    </svg>
                </button>
            </div>
            <button class="numpad-pay-btn" id="payButton" onclick="proceedToPayment()" disabled>
                <span id="payButtonText">确认支付</span>
            </button>
        </div>
    </div>

    <style>
        /* Keyboard toggle handle */
        .numpad-handle {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4px 0 2px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .handle-bar {
            width: 32px;
            height: 3px;
            background: var(--text-tertiary);
            border-radius: 2px;
            opacity: 0.5;
        }
        .handle-hint {
            font-size: 10px;
            color: var(--text-tertiary);
            margin-top: 2px;
            transition: opacity 0.2s;
        }
        
        /* Collapsed state */
        .numpad-container.collapsed .numpad-grid,
        .numpad-container.collapsed .token-selector {
            display: none;
        }
        .numpad-container.collapsed {
            padding-bottom: calc(6px + env(safe-area-inset-bottom, 0));
        }
        .numpad-container.collapsed .numpad-pay-btn {
            margin-top: 6px;
        }
        
        /* Transition */
        .numpad-container {
            transition: all 0.25s ease-out;
        }
        .numpad-grid, .token-selector {
            transition: all 0.2s ease-out;
        }

        /* Token selector chips */
        .token-selector {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 6px 12px;
            background: var(--bg-primary);
        }
        .token-chip {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            border-radius: 16px;
            background: var(--bg-card);
            border: 1.5px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s;
        }
            gap: 6px;
            padding: 8px 16px;
            border-radius: 20px;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s;
        }
        .token-chip:active {
            transform: scale(0.95);
        }
        .token-chip.selected {
            border-color: var(--accent-green);
            background: rgba(7, 193, 96, 0.1);
        }
        .token-chip-icon {
            font-size: 13px;
            font-weight: bold;
        }
        .token-chip[data-token="USDT"] .token-chip-icon { color: #26A17B; }
        .token-chip[data-token="USDC"] .token-chip-icon { color: #2775CA; }
        .token-chip[data-token="ETH"] .token-chip-icon { color: #627EEA; }
        .token-chip-name {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-primary);
        }
    </style>

    <script>
        // Keyboard collapsed state
        let keyboardCollapsed = false;
        
        function toggleKeyboard() {
            if (navigator.vibrate) navigator.vibrate(5);
            keyboardCollapsed = !keyboardCollapsed;
            const container = document.getElementById('numpadContainer');
            const hint = document.getElementById('handleHint');
            
            if (keyboardCollapsed) {
                container.classList.add('collapsed');
                hint.textContent = '点击展开键盘';
            } else {
                container.classList.remove('collapsed');
                hint.textContent = '下滑收起键盘';
            }
        }
        
        // Selected token
        let selectedToken = 'USDT';
        
        // Exchange rates (demo)
        const RATES = {
            USDT: 35.40,
            USDC: 35.35,
            ETH: 120000
        };

        function selectToken(token) {
            if (navigator.vibrate) navigator.vibrate(5);
            
            selectedToken = token;
            
            // Update UI
            document.querySelectorAll('.token-chip').forEach(chip => {
                chip.classList.remove('selected');
            });
            document.querySelector(`[data-token="${token}"]`).classList.add('selected');
            
            // Update crypto hint
            updateDisplay();
        }

        // Get merchant info from localStorage
        const merchantName = localStorage.getItem('merchantName') || 'PromptPay 商户';
        let currentAmount = localStorage.getItem('amountTHB') || '0';
        const amountFromQR = localStorage.getItem('amountFromQR') === 'true';
        let paymentNote = localStorage.getItem('paymentNote') || '';

        // Set merchant name
        document.getElementById('merchantName').textContent = merchantName;

        // If amount was from QR, show it
        if (amountFromQR && currentAmount !== '0') {
            // Amount is fixed from QR code
            document.querySelector('.amount-hint').innerHTML =
                '<span style="color: var(--accent-green);">金额已由商户设定</span>';
        }

        // Initialize note preview
        updateNotePreview();

        // Update display
        function updateDisplay() {
            const display = document.getElementById('amountDisplay');
            const formatted = formatAmount(currentAmount);
            display.textContent = formatted;

            // Update crypto hint based on selected token
            const amount = parseFloat(currentAmount) || 0;
            const rate = RATES[selectedToken];
            let cryptoAmount;
            
            if (selectedToken === 'ETH') {
                cryptoAmount = (amount / rate).toFixed(6);
            } else {
                cryptoAmount = (amount / rate).toFixed(2);
            }
            
            if (!amountFromQR) {
                document.getElementById('cryptoHint').textContent = `≈ ${cryptoAmount} ${selectedToken}`;
            }

            // Enable/disable pay button and update text
            const payButton = document.getElementById('payButton');
            const payButtonText = document.getElementById('payButtonText');
            
            if (amount > 0) {
                payButton.disabled = false;
                payButton.classList.add('active');
                payButtonText.textContent = `确认支付 ${cryptoAmount} ${selectedToken}`;
            } else {
                payButton.disabled = true;
                payButton.classList.remove('active');
                payButtonText.textContent = '确认支付';
            }
        }

        function formatAmount(amount) {
            if (!amount || amount === '0') return '0';

            // Handle decimal point
            const parts = amount.split('.');
            const integerPart = parts[0] || '0';
            const decimalPart = parts[1];

            // Add thousand separators
            const formattedInteger = parseInt(integerPart).toLocaleString();

            if (decimalPart !== undefined) {
                return `${formattedInteger}.${decimalPart}`;
            }
            return formattedInteger;
        }

        function addDigit(digit) {
            // If amount from QR, don't allow editing
            if (amountFromQR) return;

            // Haptic feedback
            if (navigator.vibrate) {
                navigator.vibrate(5);
            }

            if (digit === '.') {
                if (currentAmount.includes('.')) return;
                if (!currentAmount || currentAmount === '0') currentAmount = '0';
                currentAmount += '.';
            } else {
                if (currentAmount === '0') {
                    currentAmount = digit;
                } else {
                    // Limit to 2 decimal places
                    if (currentAmount.includes('.')) {
                        const parts = currentAmount.split('.');
                        if (parts[1].length >= 2) return;
                    }
                    // Limit total amount
                    if (parseFloat(currentAmount + digit) > 999999.99) return;
                    currentAmount += digit;
                }
            }

            updateDisplay();
        }

        function deleteDigit() {
            // If amount from QR, don't allow editing
            if (amountFromQR) return;

            // Haptic feedback
            if (navigator.vibrate) {
                navigator.vibrate(5);
            }

            if (currentAmount.length > 1) {
                currentAmount = currentAmount.slice(0, -1);
            } else {
                currentAmount = '0';
            }

            updateDisplay();
        }

        function proceedToPayment() {
            if (parseFloat(currentAmount) <= 0) return;

            // Haptic feedback
            if (navigator.vibrate) {
                navigator.vibrate(10);
            }

            const amount = parseFloat(currentAmount);
            const rate = RATES[selectedToken];
            let cryptoAmount;
            
            if (selectedToken === 'ETH') {
                cryptoAmount = (amount / rate).toFixed(6);
            } else {
                cryptoAmount = (amount / rate).toFixed(2);
            }

            // Save data
            localStorage.setItem('merchantName', merchantName);
            localStorage.setItem('amountTHB', currentAmount);
            localStorage.setItem('paymentNote', paymentNote);
            localStorage.setItem('selectedToken', selectedToken);
            localStorage.setItem('amountCrypto', cryptoAmount);
            localStorage.setItem('exchangeRate', rate.toString());

            // Show loading on button
            const payButton = document.getElementById('payButton');
            const payButtonText = document.getElementById('payButtonText');
            payButtonText.textContent = '处理中...';
            payButton.disabled = true;
            payButton.style.opacity = '0.8';

            // Navigate to success page after delay
            setTimeout(() => {
                window.location.href = '/customer/success.html';
            }, 1000);
        }

        function goBack() {
            // Haptic feedback
            if (navigator.vibrate) {
                navigator.vibrate(5);
            }

            // Clear amount from QR flag
            localStorage.removeItem('amountFromQR');

            window.location.href = '/customer/scan.html';
        }

        // Note Modal Functions
        function openNoteModal() {
            if (navigator.vibrate) navigator.vibrate(5);
            const modal = document.getElementById('noteModal');
            modal.classList.add('show');
            document.getElementById('noteInput').value = paymentNote;
            updateCharCount();
            // Delay focus to avoid animation jank
            setTimeout(() => {
                document.getElementById('noteInput').focus();
            }, 200);
        }

        function closeNoteModal(event) {
            if (event && event.target !== document.getElementById('noteModal')) return;
            document.getElementById('noteInput').blur();
            document.getElementById('noteModal').classList.remove('show');
        }

        function updateCharCount() {
            const count = document.getElementById('noteInput').value.length;
            document.getElementById('charCount').textContent = count;
        }

        function addQuickTag(tag) {
            if (navigator.vibrate) {
                navigator.vibrate(5);
            }
            const input = document.getElementById('noteInput');
            const currentValue = input.value;
            if (currentValue) {
                input.value = currentValue + '、' + tag;
            } else {
                input.value = tag;
            }
            updateCharCount();
        }

        function clearNote() {
            if (navigator.vibrate) {
                navigator.vibrate(5);
            }
            document.getElementById('noteInput').value = '';
            updateCharCount();
        }

        function saveNote() {
            if (navigator.vibrate) {
                navigator.vibrate(10);
            }
            paymentNote = document.getElementById('noteInput').value.trim();
            localStorage.setItem('paymentNote', paymentNote);
            updateNotePreview();
            closeNoteModal();
        }

        function updateNotePreview() {
            const preview = document.getElementById('notePreview');
            if (paymentNote) {
                preview.textContent = paymentNote;
                preview.classList.add('has-note');
            } else {
                preview.textContent = '点击添加商品描述（可选）';
                preview.classList.remove('has-note');
            }
        }

        // Event listener for textarea
        document.getElementById('noteInput').addEventListener('input', updateCharCount);

        // Initialize display
        updateDisplay();

        // Handle keyboard input (for desktop testing)
        document.addEventListener('keydown', (e) => {
            // Don't handle keyboard when modal is open
            if (document.getElementById('noteModal').classList.contains('show')) return;
            if (amountFromQR) return;

            if (e.key >= '0' && e.key <= '9') {
                addDigit(e.key);
            } else if (e.key === '.') {
                addDigit('.');
            } else if (e.key === 'Backspace') {
                e.preventDefault();
                deleteDigit();
            } else if (e.key === 'Enter') {
                proceedToTokenSelection();
            }
        });
    </script>
</body>
</html>
