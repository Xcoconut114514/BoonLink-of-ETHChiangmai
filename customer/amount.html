<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#191919">
    <title>付款 - BoonLink</title>
    <link rel="stylesheet" href="/shared/css/wechat-dark.css">
    <style>
        /* Amount card clickable */
        .wc-amount-card {
            cursor: pointer;
            transition: background 0.2s;
        }
        .wc-amount-card:active {
            background: var(--bg-card);
        }
        
        /* Numpad overlay */
        .wc-numpad-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 500;
            display: none;
        }
        .wc-numpad-overlay.show {
            display: block;
        }
        
        /* Numpad container - slides up */
        .wc-numpad {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 428px;
            margin: 0 auto;
            transform: translateY(100%);
            transition: transform 0.25s ease-out;
            z-index: 501;
        }
        .wc-numpad.show {
            transform: translateY(0);
        }
        
        /* Note card */
        .wc-note-card {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 12px 16px;
            padding: 14px 16px;
            background: var(--bg-secondary);
            border-radius: 10px;
            cursor: pointer;
        }
        .wc-note-icon { font-size: 18px; }
        .wc-note-text {
            flex: 1;
            font-size: 14px;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .wc-note-text.has-note { color: var(--text-primary); }
        .wc-note-arrow { font-size: 20px; color: var(--text-tertiary); }
        
        /* Note Modal - bottom sheet */
        .note-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            display: none;
        }
        .note-modal-overlay.show {
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }
        .note-modal {
            width: 100%;
            max-width: 428px;
            background: var(--bg-secondary);
            border-radius: 16px 16px 0 0;
            padding-bottom: env(safe-area-inset-bottom, 0);
        }
        .note-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
        }
        .note-modal-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .note-modal-close {
            background: none;
            border: none;
            font-size: 18px;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px 8px;
        }
        .note-modal-body {
            padding: 16px;
        }
        .note-textarea {
            width: 100%;
            height: 90px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 15px;
            resize: none;
            font-family: inherit;
            box-sizing: border-box;
        }
        .note-textarea:focus {
            outline: none;
            border-color: var(--accent-green);
        }
        .note-textarea::placeholder {
            color: var(--text-tertiary);
        }
        .note-char-count {
            text-align: right;
            font-size: 12px;
            color: var(--text-tertiary);
            margin-top: 8px;
        }
        .note-quick-label {
            font-size: 13px;
            color: var(--text-secondary);
            margin: 16px 0 10px;
        }
        .note-quick-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .note-quick-tag {
            padding: 8px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            font-size: 13px;
            color: var(--text-primary);
            cursor: pointer;
        }
        .note-quick-tag:active {
            background: var(--accent-green);
            border-color: var(--accent-green);
            color: white;
        }
        /* Optimize modal animation performance */
        .note-modal-overlay {
            will-change: opacity;
            transform: translateZ(0);
        }
        .note-modal {
            will-change: transform;
            transform: translateZ(0);
        }
        .note-modal-footer {
            display: flex;
            gap: 12px;
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
        }
        .note-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .note-btn-cancel {
            background: var(--bg-card);
            color: var(--text-primary);
        }
        .note-btn-confirm {
            background: var(--accent-green);
            color: white;
        }
        
        /* Fixed pay button for QR amount */
        .wc-fixed-pay-container {
            margin: 20px 16px;
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
        .wc-fixed-pay-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #07C160 0%, #06AD56 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(7, 193, 96, 0.3);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .wc-fixed-pay-btn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 8px rgba(7, 193, 96, 0.2);
        }
        .wc-fixed-pay-btn:disabled {
            background: #666;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="wc-header">
            <button class="wc-header-btn" onclick="goBack()">✕</button>
            <div class="wc-header-title">BoonLink 支付</div>
            <button class="wc-header-btn">⋯</button>
        </div>

        <!-- Merchant Info -->
        <div class="wc-merchant">
            <div class="wc-merchant-label">付款给商户</div>
            <div class="wc-merchant-name" id="merchantName">PromptPay 商户</div>
        </div>

        <!-- Amount Card - Click to show numpad -->
        <div class="wc-amount-card" onclick="showNumpad()">
            <div class="wc-amount-label">付款金额</div>
            <div class="wc-amount-row">
                <span class="wc-amount-currency">THB</span>
                <span class="wc-amount-value" id="amountDisplay">0</span>
                <span class="wc-amount-cursor" id="cursor"></span>
            </div>
            <div class="wc-amount-line"></div>
            <div class="wc-amount-hint">
                ≈ <span class="crypto" id="cryptoHint">0.00 USDT</span>
            </div>
        </div>

        <!-- Note Input -->
        <div class="wc-note-card" onclick="openNoteModal()">
            <span class="wc-note-icon">📝</span>
            <span class="wc-note-text" id="notePreview">添加备注（可选）</span>
            <span class="wc-note-arrow">›</span>
        </div>

        <!-- Fixed amount pay button (visible when amountFromQR is true) -->
        <div class="wc-fixed-pay-container" id="fixedPayContainer" style="display:none;">
            <button class="wc-fixed-pay-btn" id="fixedPayButton" onclick="showConfirmModal()">
                确认付款
            </button>
        </div>

        <!-- Brand -->
        <div class="wc-brand">
            <svg class="wc-brand-icon" viewBox="0 0 24 24" fill="none" stroke="#07C160" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <path d="M9 12l2 2 4-4"/>
            </svg>
            <div class="wc-brand-text">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                </svg>
                BoonLink 加密支付
            </div>
        </div>
    </div>

    <!-- Numpad Overlay -->
    <div class="wc-numpad-overlay" id="numpadOverlay" onclick="hideNumpad()"></div>
    
    <!-- Numpad -->
    <div class="wc-numpad" id="numpad">
        <div class="wc-numpad-grid">
            <button class="wc-key" onclick="addDigit('1')">1</button>
            <button class="wc-key" onclick="addDigit('2')">2</button>
            <button class="wc-key" onclick="addDigit('3')">3</button>
            <button class="wc-key wc-key-delete" onclick="deleteDigit()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 4H8l-7 8 7 8h13a2 2 0 002-2V6a2 2 0 00-2-2z"/>
                    <line x1="18" y1="9" x2="12" y2="15"/>
                    <line x1="12" y1="9" x2="18" y2="15"/>
                </svg>
            </button>
            <button class="wc-key" onclick="addDigit('4')">4</button>
            <button class="wc-key" onclick="addDigit('5')">5</button>
            <button class="wc-key" onclick="addDigit('6')">6</button>
            <button class="wc-key wc-key-pay" id="payButton" onclick="showConfirmModal()" disabled>付款</button>
            <button class="wc-key" onclick="addDigit('7')">7</button>
            <button class="wc-key" onclick="addDigit('8')">8</button>
            <button class="wc-key" onclick="addDigit('9')">9</button>
            <button class="wc-key wc-key-zero" onclick="addDigit('0')">0</button>
            <button class="wc-key" onclick="addDigit('.')">.</button>
        </div>
    </div>

    <!-- Note Modal -->
    <div class="note-modal-overlay" id="noteModal" onclick="closeNoteModal(event)">
        <div class="note-modal" onclick="event.stopPropagation()">
            <div class="note-modal-header">
                <div class="note-modal-title">添加备注</div>
                <button class="note-modal-close" onclick="closeNoteModal()">✕</button>
            </div>
            <div class="note-modal-body">
                <textarea id="noteInput" class="note-textarea" placeholder="例如：一份猪肉打抛饭、两杯泰式奶茶..." maxlength="100" oninput="updateCharCount()"></textarea>
                <div class="note-char-count"><span id="charCount">0</span>/100</div>
                <div class="note-quick-label">快捷标签</div>
                <div class="note-quick-tags">
                    <span class="note-quick-tag" onclick="addTag('打抛饭')">打抛饭</span>
                    <span class="note-quick-tag" onclick="addTag('泰式奶茶')">泰式奶茶</span>
                    <span class="note-quick-tag" onclick="addTag('芒果糯米饭')">芒果糯米饭</span>
                    <span class="note-quick-tag" onclick="addTag('冬阴功汤')">冬阴功汤</span>
                    <span class="note-quick-tag" onclick="addTag('青木瓜沙拉')">青木瓜沙拉</span>
                    <span class="note-quick-tag" onclick="addTag('椰子水')">椰子水</span>
                </div>
            </div>
            <div class="note-modal-footer">
                <button class="note-btn note-btn-cancel" onclick="clearNote()">清除</button>
                <button class="note-btn note-btn-confirm" onclick="saveNote()">确定</button>
            </div>
        </div>
    </div>

    <!-- Confirm Payment Modal -->
    <div class="wc-modal-overlay" id="confirmModal">
        <div class="wc-modal">
            <div class="wc-modal-header">
                <div class="wc-modal-title">确认付款</div>
            </div>
            <div class="wc-modal-body" id="modalBody">
                <div class="wc-modal-amount" id="modalAmount">0 USDT</div>
                <div class="wc-modal-merchant" id="modalMerchant">付款给 PromptPay 商户</div>
                <div class="wc-modal-info">
                    请在钱包中确认交易签名<br>
                    网络：BSC (BNB Smart Chain)
                </div>
            </div>
            <div class="wc-modal-footer" id="modalFooter">
                <button class="wc-modal-btn wc-modal-btn-cancel" onclick="closeConfirmModal()">取消</button>
                <button class="wc-modal-btn wc-modal-btn-confirm" onclick="confirmPayment()">确认</button>
            </div>
        </div>
    </div>

    <script src="/customer/js/wallet.js"></script>
    <script>
        // System limits (cannot be exceeded)
        const SYSTEM_LIMITS = {
            perTransaction: 5000,  // 单笔上限 ฿5,000
            daily: 20000           // 每日上限 ฿20,000
        };

        // User limits
        const userLimits = JSON.parse(localStorage.getItem('userLimits') || 'null') || {
            perTransaction: SYSTEM_LIMITS.perTransaction,
            daily: SYSTEM_LIMITS.daily
        };

        // Today's usage
        let todayUsed = parseInt(localStorage.getItem('todayUsed') || '0');
        const lastUsedDate = localStorage.getItem('lastUsedDate');
        const today = new Date().toDateString();
        if (lastUsedDate !== today) {
            todayUsed = 0;
            localStorage.setItem('todayUsed', '0');
            localStorage.setItem('lastUsedDate', today);
        }

        // State
        let currentAmount = '0';
        let paymentNote = localStorage.getItem('paymentNote') || '';
        const RATE = 35.40;

        // Get merchant info
        const merchantName = localStorage.getItem('merchantName') || 'PromptPay 商户';
        const merchantId = localStorage.getItem('merchantId') || '';
        const amountFromQR = localStorage.getItem('amountFromQR') === 'true';
        const qrAmount = localStorage.getItem('amountTHB') || '0';

        // Init
        document.getElementById('merchantName').textContent = merchantName;
        updateNotePreview();

        if (amountFromQR && qrAmount !== '0') {
            currentAmount = qrAmount;
            document.getElementById('cursor').style.display = 'none';
            // Show fixed pay button instead of numpad
            document.getElementById('fixedPayContainer').style.display = 'block';
            // Disable amount card click interaction
            document.querySelector('.wc-amount-card').style.cursor = 'default';
            updateDisplay();
        }

        // Check if amount exceeds limits
        function checkLimits(amount) {
            const thbAmount = parseFloat(amount) || 0;
            const effectivePerTx = Math.min(userLimits.perTransaction, SYSTEM_LIMITS.perTransaction);
            const effectiveDaily = Math.min(userLimits.daily, SYSTEM_LIMITS.daily);
            const remainingDaily = effectiveDaily - todayUsed;
            
            if (thbAmount > effectivePerTx) {
                return { ok: false, error: `单笔限额 ฿${effectivePerTx.toLocaleString()}` };
            }
            if (thbAmount > remainingDaily) {
                return { ok: false, error: `今日剩余限额 ฿${remainingDaily.toLocaleString()}` };
            }
            return { ok: true };
        }

        // Numpad functions
        function showNumpad() {
            if (amountFromQR) return;
            document.getElementById('numpadOverlay').classList.add('show');
            document.getElementById('numpad').classList.add('show');
        }

        function hideNumpad() {
            document.getElementById('numpadOverlay').classList.remove('show');
            document.getElementById('numpad').classList.remove('show');
        }

        function updateDisplay() {
            document.getElementById('amountDisplay').textContent = currentAmount === '0' ? '0' : formatAmount(currentAmount);
            const thbAmount = parseFloat(currentAmount) || 0;
            const cryptoAmount = (thbAmount / RATE).toFixed(2);
            document.getElementById('cryptoHint').textContent = `${cryptoAmount} USDT`;
            
            const limitCheck = checkLimits(currentAmount);
            const payBtn = document.getElementById('payButton');
            payBtn.disabled = thbAmount <= 0 || !limitCheck.ok;
            
            // Show limit warning if exceeded
            if (!limitCheck.ok && thbAmount > 0) {
                payBtn.textContent = limitCheck.error;
            } else {
                payBtn.textContent = '付款';
            }
        }

        function formatAmount(amount) {
            if (!amount || amount === '0') return '0';
            const parts = amount.split('.');
            const integerPart = parseInt(parts[0] || '0').toLocaleString();
            return parts[1] !== undefined ? `${integerPart}.${parts[1]}` : integerPart;
        }

        function addDigit(digit) {
            if (amountFromQR) return;
            if (digit === '.' && currentAmount.includes('.')) return;
            if (currentAmount === '0' && digit !== '.') {
                currentAmount = digit;
            } else {
                if (currentAmount.includes('.') && currentAmount.split('.')[1]?.length >= 2) return;
                if (currentAmount.replace('.', '').length >= 10) return;
                currentAmount += digit;
            }
            updateDisplay();
        }

        function deleteDigit() {
            if (amountFromQR) return;
            currentAmount = currentAmount.length <= 1 ? '0' : currentAmount.slice(0, -1);
            updateDisplay();
        }

        // Note functions - optimized for performance
        let noteModalReady = false;
        function openNoteModal() {
            const modal = document.getElementById('noteModal');
            const input = document.getElementById('noteInput');
            
            // Use requestAnimationFrame for smoother animation
            requestAnimationFrame(() => {
                modal.classList.add('show');
                input.value = paymentNote;
                document.getElementById('charCount').textContent = paymentNote.length;
                // Delay focus to prevent layout thrashing
                requestAnimationFrame(() => {
                    input.focus();
                });
            });
        }

        function closeNoteModal(event) {
            if (event && event.target.id !== 'noteModal') return;
            document.getElementById('noteModal').classList.remove('show');
        }

        // Debounced char count update
        let charCountTimeout;
        function updateCharCount() {
            if (charCountTimeout) clearTimeout(charCountTimeout);
            charCountTimeout = setTimeout(() => {
                document.getElementById('charCount').textContent = document.getElementById('noteInput').value.length;
            }, 50);
        }

        function addTag(tag) {
            const input = document.getElementById('noteInput');
            input.value = input.value ? input.value + '、' + tag : tag;
            updateCharCount();
        }

        function clearNote() {
            document.getElementById('noteInput').value = '';
            document.getElementById('charCount').textContent = '0';
        }

        function saveNote() {
            paymentNote = document.getElementById('noteInput').value.trim();
            localStorage.setItem('paymentNote', paymentNote);
            updateNotePreview();
            document.getElementById('noteModal').classList.remove('show');
        }

        function updateNotePreview() {
            const preview = document.getElementById('notePreview');
            if (paymentNote) {
                preview.textContent = paymentNote;
                preview.classList.add('has-note');
            } else {
                preview.textContent = '添加备注（可选）';
                preview.classList.remove('has-note');
            }
        }

        // Payment functions
        function showConfirmModal() {
            hideNumpad();
            const thbAmount = parseFloat(currentAmount) || 0;
            const cryptoAmount = (thbAmount / RATE).toFixed(2);
            document.getElementById('modalAmount').textContent = `${cryptoAmount} USDT`;
            document.getElementById('modalMerchant').textContent = `付款给 ${merchantName}`;
            document.getElementById('confirmModal').classList.add('show');
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.remove('show');
            resetConfirmModal();
        }

        function resetConfirmModal() {
            const thbAmount = parseFloat(currentAmount) || 0;
            const cryptoAmount = (thbAmount / RATE).toFixed(2);
            document.getElementById('modalBody').innerHTML = `
                <div class="wc-modal-amount" id="modalAmount">${cryptoAmount} USDT</div>
                <div class="wc-modal-merchant" id="modalMerchant">付款给 ${merchantName}</div>
                <div class="wc-modal-info">请在钱包中确认交易签名<br>网络：BSC (BNB Smart Chain)</div>
            `;
            document.getElementById('modalFooter').innerHTML = `
                <button class="wc-modal-btn wc-modal-btn-cancel" onclick="closeConfirmModal()">取消</button>
                <button class="wc-modal-btn wc-modal-btn-confirm" onclick="confirmPayment()">确认</button>
            `;
            document.getElementById('modalFooter').style.display = 'flex';
        }

        async function confirmPayment() {
            const modalBody = document.getElementById('modalBody');
            const modalFooter = document.getElementById('modalFooter');

            modalBody.innerHTML = `<div class="wc-loading"><div class="wc-spinner"></div><div class="wc-loading-text">正在连接钱包...</div></div>`;
            modalFooter.style.display = 'none';

            try {
                await connectWallet();
                modalBody.querySelector('.wc-loading-text').textContent = '请在钱包中确认签名...';

                const thbAmount = parseFloat(currentAmount) || 0;
                const cryptoAmount = (thbAmount / RATE).toFixed(6);

                const txHash = await signAndSendPayment({
                    amount: cryptoAmount,
                    token: 'USDT',
                    merchantId: merchantId,
                    merchantName: merchantName,
                    thbAmount: thbAmount
                });

                // Update today's usage
                todayUsed += thbAmount;
                localStorage.setItem('todayUsed', todayUsed.toString());
                localStorage.setItem('lastUsedDate', new Date().toDateString());

                localStorage.setItem('txHash', txHash);
                localStorage.setItem('cryptoAmount', cryptoAmount);
                localStorage.setItem('tokenSymbol', 'USDT');
                localStorage.setItem('amountTHB', currentAmount);
                localStorage.setItem('paymentTime', new Date().toISOString());

                window.location.href = '/customer/success.html';
            } catch (error) {
                console.error('Payment error:', error);
                modalBody.innerHTML = `
                    <div style="padding: 20px; text-align: center;">
                        <div style="font-size: 40px; margin-bottom: 12px;">❌</div>
                        <div style="font-size: 15px; color: var(--text-primary); margin-bottom: 8px;">支付失败</div>
                        <div style="font-size: 13px; color: var(--text-secondary);">${error.message || '请重试'}</div>
                    </div>
                `;
                modalFooter.innerHTML = `<button class="wc-modal-btn wc-modal-btn-confirm" onclick="closeConfirmModal()" style="border:none;">关闭</button>`;
                modalFooter.style.display = 'flex';
            }
        }

        function goBack() {
            localStorage.removeItem('amountFromQR');
            window.location.href = '/customer/scan.html';
        }
    </script>
</body>
</html>
