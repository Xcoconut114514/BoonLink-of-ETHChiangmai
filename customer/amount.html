<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#191919">
    <title>付款 - BoonLink</title>
    <link rel="stylesheet" href="/shared/css/wechat-dark.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="wc-header">
            <button class="wc-header-btn" onclick="goBack()">✕</button>
            <div class="wc-header-title">BoonLink 支付</div>
            <button class="wc-header-btn">⋯</button>
        </div>

        <!-- Merchant Info -->
        <div class="wc-merchant">
            <div class="wc-merchant-label">付款给商户</div>
            <div class="wc-merchant-name" id="merchantName">PromptPay 商户</div>
        </div>

        <!-- Amount Card -->
        <div class="wc-amount-card">
            <div class="wc-amount-label">付款金额</div>
            <div class="wc-amount-row">
                <span class="wc-amount-currency">THB</span>
                <span class="wc-amount-value" id="amountDisplay">0</span>
                <span class="wc-amount-cursor" id="cursor"></span>
            </div>
            <div class="wc-amount-line"></div>
            <div class="wc-amount-hint">
                ≈ <span class="crypto" id="cryptoHint">0.00 USDT</span>
            </div>
        </div>

        <!-- Brand -->
        <div class="wc-brand">
            <svg class="wc-brand-icon" viewBox="0 0 24 24" fill="none" stroke="#07C160" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <path d="M9 12l2 2 4-4"/>
            </svg>
            <div class="wc-brand-text">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                </svg>
                BoonLink 加密支付
            </div>
        </div>

        <!-- Numpad -->
        <div class="wc-numpad">
            <div class="wc-numpad-grid">
                <!-- Row 1 -->
                <button class="wc-key" onclick="addDigit('1')">1</button>
                <button class="wc-key" onclick="addDigit('2')">2</button>
                <button class="wc-key" onclick="addDigit('3')">3</button>
                <button class="wc-key wc-key-delete" onclick="deleteDigit()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 4H8l-7 8 7 8h13a2 2 0 002-2V6a2 2 0 00-2-2z"/>
                        <line x1="18" y1="9" x2="12" y2="15"/>
                        <line x1="12" y1="9" x2="18" y2="15"/>
                    </svg>
                </button>
                <!-- Row 2 -->
                <button class="wc-key" onclick="addDigit('4')">4</button>
                <button class="wc-key" onclick="addDigit('5')">5</button>
                <button class="wc-key" onclick="addDigit('6')">6</button>
                <button class="wc-key wc-key-pay" id="payButton" onclick="showConfirmModal()" disabled>付款</button>
                <!-- Row 3 -->
                <button class="wc-key" onclick="addDigit('7')">7</button>
                <button class="wc-key" onclick="addDigit('8')">8</button>
                <button class="wc-key" onclick="addDigit('9')">9</button>
                <!-- Row 4 -->
                <button class="wc-key wc-key-zero" onclick="addDigit('0')">0</button>
                <button class="wc-key" onclick="addDigit('.')">.</button>
            </div>
        </div>
    </div>

    <!-- Confirm Payment Modal -->
    <div class="wc-modal-overlay" id="confirmModal">
        <div class="wc-modal">
            <div class="wc-modal-header">
                <div class="wc-modal-title">确认付款</div>
            </div>
            <div class="wc-modal-body" id="modalBody">
                <div class="wc-modal-amount" id="modalAmount">0 USDT</div>
                <div class="wc-modal-merchant" id="modalMerchant">付款给 PromptPay 商户</div>
                <div class="wc-modal-info">
                    请在钱包中确认交易签名<br>
                    网络：BSC (BNB Smart Chain)
                </div>
            </div>
            <div class="wc-modal-footer" id="modalFooter">
                <button class="wc-modal-btn wc-modal-btn-cancel" onclick="closeConfirmModal()">取消</button>
                <button class="wc-modal-btn wc-modal-btn-confirm" onclick="confirmPayment()">确认</button>
            </div>
        </div>
    </div>

    <script src="/customer/js/wallet.js"></script>
    <script>
        // State
        let currentAmount = '0';
        let selectedToken = 'USDT';
        const RATE = 35.40; // 1 USDT = 35.40 THB

        // Get merchant info from localStorage
        const merchantName = localStorage.getItem('merchantName') || 'PromptPay 商户';
        const merchantId = localStorage.getItem('merchantId') || '';
        const amountFromQR = localStorage.getItem('amountFromQR') === 'true';
        const qrAmount = localStorage.getItem('amountTHB') || '0';

        // Initialize
        document.getElementById('merchantName').textContent = merchantName;

        // If amount was preset from QR code
        if (amountFromQR && qrAmount !== '0') {
            currentAmount = qrAmount;
            document.getElementById('cursor').style.display = 'none';
        }

        updateDisplay();

        function updateDisplay() {
            const display = document.getElementById('amountDisplay');
            display.textContent = currentAmount === '0' ? '0' : formatAmount(currentAmount);

            // Calculate crypto amount
            const thbAmount = parseFloat(currentAmount) || 0;
            const cryptoAmount = (thbAmount / RATE).toFixed(2);
            document.getElementById('cryptoHint').textContent = `${cryptoAmount} USDT`;

            // Enable/disable pay button
            const payBtn = document.getElementById('payButton');
            payBtn.disabled = thbAmount <= 0;
        }

        function formatAmount(amount) {
            if (!amount || amount === '0') return '0';
            const parts = amount.split('.');
            const integerPart = parts[0] || '0';
            const decimalPart = parts[1];
            const formattedInteger = parseInt(integerPart).toLocaleString();
            if (decimalPart !== undefined) {
                return `${formattedInteger}.${decimalPart}`;
            }
            return formattedInteger;
        }

        function addDigit(digit) {
            if (amountFromQR) return; // Can't edit if from QR

            if (digit === '.') {
                if (currentAmount.includes('.')) return;
                if (currentAmount === '0') currentAmount = '0';
            }

            if (currentAmount === '0' && digit !== '.') {
                currentAmount = digit;
            } else {
                // Limit decimal places to 2
                if (currentAmount.includes('.')) {
                    const decimalPart = currentAmount.split('.')[1];
                    if (decimalPart && decimalPart.length >= 2) return;
                }
                // Limit total length
                if (currentAmount.replace('.', '').length >= 10) return;
                currentAmount += digit;
            }

            updateDisplay();
        }

        function deleteDigit() {
            if (amountFromQR) return;

            if (currentAmount.length <= 1) {
                currentAmount = '0';
            } else {
                currentAmount = currentAmount.slice(0, -1);
            }
            updateDisplay();
        }

        function showConfirmModal() {
            const thbAmount = parseFloat(currentAmount) || 0;
            const cryptoAmount = (thbAmount / RATE).toFixed(2);

            document.getElementById('modalAmount').textContent = `${cryptoAmount} USDT`;
            document.getElementById('modalMerchant').textContent = `付款给 ${merchantName}`;
            document.getElementById('confirmModal').classList.add('show');
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.remove('show');
            // Reset modal to default state
            document.getElementById('modalBody').innerHTML = `
                <div class="wc-modal-amount" id="modalAmount">${document.getElementById('modalAmount')?.textContent || '0 USDT'}</div>
                <div class="wc-modal-merchant" id="modalMerchant">付款给 ${merchantName}</div>
                <div class="wc-modal-info">
                    请在钱包中确认交易签名<br>
                    网络：BSC (BNB Smart Chain)
                </div>
            `;
            document.getElementById('modalFooter').style.display = 'flex';
            document.getElementById('modalFooter').innerHTML = `
                <button class="wc-modal-btn wc-modal-btn-cancel" onclick="closeConfirmModal()">取消</button>
                <button class="wc-modal-btn wc-modal-btn-confirm" onclick="confirmPayment()">确认</button>
            `;
        }

        async function confirmPayment() {
            const modalBody = document.getElementById('modalBody');
            const modalFooter = document.getElementById('modalFooter');

            // Show loading
            modalBody.innerHTML = `
                <div class="wc-loading">
                    <div class="wc-spinner"></div>
                    <div class="wc-loading-text">正在连接钱包...</div>
                </div>
            `;
            modalFooter.style.display = 'none';

            try {
                // Connect wallet
                await connectWallet();

                modalBody.querySelector('.wc-loading-text').textContent = '请在钱包中确认签名...';

                // Prepare payment data
                const thbAmount = parseFloat(currentAmount) || 0;
                const cryptoAmount = (thbAmount / RATE).toFixed(6);

                // Sign and send transaction
                const txHash = await signAndSendPayment({
                    amount: cryptoAmount,
                    token: 'USDT',
                    merchantId: merchantId,
                    merchantName: merchantName,
                    thbAmount: thbAmount
                });

                // Store transaction info
                localStorage.setItem('txHash', txHash);
                localStorage.setItem('cryptoAmount', cryptoAmount);
                localStorage.setItem('tokenSymbol', 'USDT');
                localStorage.setItem('amountTHB', currentAmount);
                localStorage.setItem('paymentTime', new Date().toISOString());

                // Go to success page
                window.location.href = '/customer/success.html';

            } catch (error) {
                console.error('Payment error:', error);
                modalBody.innerHTML = `
                    <div style="padding: 20px; text-align: center;">
                        <div style="font-size: 40px; margin-bottom: 12px;">❌</div>
                        <div style="font-size: 15px; color: var(--text-primary); margin-bottom: 8px;">支付失败</div>
                        <div style="font-size: 13px; color: var(--text-secondary);">${error.message || '请重试'}</div>
                    </div>
                `;
                modalFooter.innerHTML = `
                    <button class="wc-modal-btn wc-modal-btn-confirm" onclick="closeConfirmModal()" style="border: none;">关闭</button>
                `;
                modalFooter.style.display = 'flex';
            }
        }

        function goBack() {
            localStorage.removeItem('amountFromQR');
            window.location.href = '/customer/scan.html';
        }

        // Prevent zooming on double tap
        document.addEventListener('touchend', function(e) {
            e.preventDefault();
            e.target.click();
        }, { passive: false });
    </script>
</body>
</html>
