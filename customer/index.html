<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#EDEDED">
    <title>BoonLink - 连接钱包</title>
    <link rel="stylesheet" href="/shared/css/common.css">
    <link rel="icon" href="/shared/assets/logo.png" type="image/png">
</head>
<body>
    <div class="app-container">
        <!-- Language Switcher -->
        <div class="language-switcher">
            <button class="lang-btn active" data-lang="zh" onclick="setLanguage('zh')">中文</button>
            <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">EN</button>
            <button class="lang-btn" data-lang="th" onclick="setLanguage('th')">ไทย</button>
        </div>

        <!-- Logo Section -->
        <div class="logo-container">
            <img src="/shared/assets/logo.png" alt="BoonLink" class="logo-image">
            <div class="logo-text">BoonLink</div>
            <div class="logo-subtitle">Crypto → PromptPay</div>
        </div>

        <!-- Not Connected Section -->
        <div class="app-content" id="connectSection">
            <div class="card">
                <div class="card-header" style="text-align: center;">
                    <span style="font-size: 32px;">🔗</span>
                    <div style="margin-top: 8px;" data-i18n="connectWallet" data-i18n-section="customer">连接钱包</div>
                </div>
                <p style="text-align: center; color: var(--text-secondary); margin-bottom: 20px;" data-i18n="connectWalletDesc" data-i18n-section="customer">
                    使用自托管钱包进行安全支付
                </p>

                <!-- Wallet Options -->
                <div id="walletOptions" class="wallet-options">
                    <button class="btn btn-wallet" onclick="handleConnect('metamask')" data-wallet="metamask">
                        <span class="wallet-icon">🦊</span>
                        <span class="wallet-name">MetaMask</span>
                    </button>
                    <button class="btn btn-wallet" onclick="handleConnect('okx')" data-wallet="okx">
                        <span class="wallet-icon">⚫</span>
                        <span class="wallet-name">OKX Wallet</span>
                    </button>
                    <button class="btn btn-wallet" onclick="handleConnect('coinbase')" data-wallet="coinbase">
                        <span class="wallet-icon">🔵</span>
                        <span class="wallet-name">Coinbase</span>
                    </button>
                    <button class="btn btn-wallet" onclick="handleConnect('bitget')" data-wallet="bitget">
                        <span class="wallet-icon">💎</span>
                        <span class="wallet-name">Bitget</span>
                    </button>
                </div>

                <div class="details-list" style="margin-top: 20px;">
                    <div class="detail-item">
                        <span class="detail-label">🔐 <span data-i18n="privateKeySafe" data-i18n-section="customer">私钥安全</span></span>
                        <span class="detail-value" data-i18n="youControl" data-i18n-section="customer">您自己保管</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">📵 <span data-i18n="offlinePayment" data-i18n-section="customer">离线支付</span></span>
                        <span class="detail-value" data-i18n="supported" data-i18n-section="customer">支持</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">⚡ <span data-i18n="network" data-i18n-section="customer">网络</span></span>
                        <span class="detail-value">BSC (<span data-i18n="lowGas" data-i18n-section="customer">低 Gas</span>)</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Connected Section -->
        <div class="app-content" id="connectedSection" style="display: none;">
            <div class="card">
                <div class="card-header">
                    <span id="connectedWalletIcon">🦊</span> 
                    <span id="connectedWalletName" data-i18n="walletConnected" data-i18n-section="customer">钱包已连接</span>
                </div>
                <div class="details-list">
                    <div class="detail-item">
                        <span class="detail-label" data-i18n="address" data-i18n-section="customer">地址</span>
                        <span class="detail-value" id="walletAddress">0x...1234</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">USDT <span data-i18n="balance" data-i18n-section="customer">余额</span></span>
                        <span class="detail-value" id="usdtBalance">--</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label" data-i18n="remainingLimit" data-i18n-section="customer">今日剩余限额</span>
                        <span class="detail-value" id="remainingLimit">฿10,000</span>
                    </div>
                </div>
            </div>

            <a href="scan.html" class="btn btn-primary btn-large" style="margin-bottom: 12px;">
                <span data-i18n="scanPromptPay" data-i18n-section="customer">扫码支付 PromptPay</span>
            </a>

            <a href="settings.html" class="btn btn-secondary btn-large">
                <span data-i18n="paymentLimits" data-i18n-section="customer">设置支付限额</span>
            </a>

            <div style="text-align: center; margin-top: 20px;">
                <a href="#" onclick="handleDisconnect()" class="back-link" style="color: var(--text-tertiary);">
                    <span data-i18n="disconnectWallet" data-i18n-section="customer">断开钱包</span>
                </a>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer-info">
            <p>🔒 <span data-i18n="nonCustodial" data-i18n-section="customer">Non-custodial · 私钥不离手</span></p>
        </div>
    </div>

    <script src="/customer/js/wallet.js"></script>
    <script src="/customer/js/payment-limits.js"></script>
    <script src="/shared/js/i18n.js"></script>
    <style>
        /* Multi-wallet styles */
        .wallet-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .btn-wallet {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px 12px;
            border: 2px solid var(--border-color, #e0e0e0);
            border-radius: 12px;
            background: var(--card-bg, #fff);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-wallet:hover {
            border-color: var(--primary-color, #3B82F6);
            background: var(--hover-bg, #f8fafc);
        }
        .btn-wallet:active {
            transform: scale(0.98);
        }
        .btn-wallet .wallet-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }
        .btn-wallet .wallet-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary, #1a1a1a);
        }
        .btn-wallet.unavailable {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-wallet.unavailable .wallet-name::after {
            content: ' (未安装)';
            font-size: 11px;
            color: var(--text-tertiary, #999);
        }
    </style>
    <script>
        // Wallet icons mapping
        const WALLET_ICONS = {
            metamask: '🦊',
            okx: '⚫',
            coinbase: '🔵',
            bitget: '💎',
            generic: '🔗'
        };

        // Wait for scripts to load
        async function init() {
            // Ensure BoonLinkWallet is loaded
            if (typeof BoonLinkWallet === 'undefined') {
                console.error('BoonLinkWallet not loaded');
                return;
            }
            
            // Check available wallets and update UI
            updateWalletButtons();
            
            // Check previous connection
            const state = await BoonLinkWallet.checkConnection();
            if (state && state.isConnected) {
                await showConnectedState(state);
            }
        }

        // Update wallet button states based on availability
        function updateWalletButtons() {
            const availableWallets = BoonLinkWallet.detectWallets();
            const availableIds = availableWallets.map(w => w.id);
            
            document.querySelectorAll('.btn-wallet').forEach(btn => {
                const walletId = btn.getAttribute('data-wallet');
                if (!availableIds.includes(walletId) && walletId !== 'generic') {
                    btn.classList.add('unavailable');
                }
            });
        }

        // Connect wallet
        async function handleConnect(walletId) {
            const btn = document.querySelector(`[data-wallet="${walletId}"]`);
            if (btn && btn.classList.contains('unavailable')) {
                // Open wallet download page
                const downloadUrls = {
                    metamask: 'https://metamask.io/download/',
                    okx: 'https://www.okx.com/web3',
                    coinbase: 'https://www.coinbase.com/wallet',
                    bitget: 'https://web3.bitget.com/'
                };
                if (downloadUrls[walletId]) {
                    window.open(downloadUrls[walletId], '_blank');
                }
                return;
            }
            
            try {
                const state = await BoonLinkWallet.connect(walletId);
                await showConnectedState(state);
            } catch (error) {
                const errorMsg = typeof BoonLinkI18n !== 'undefined' ? BoonLinkI18n.tc('error') : '错误';
                alert(errorMsg + ': ' + error.message);
            }
        }

        // Disconnect wallet
        function handleDisconnect() {
            BoonLinkWallet.disconnect();
            document.getElementById('connectSection').style.display = 'block';
            document.getElementById('connectedSection').style.display = 'none';
        }

        // Show connected state
        async function showConnectedState(state) {
            document.getElementById('connectSection').style.display = 'none';
            document.getElementById('connectedSection').style.display = 'block';

            // Display wallet icon and name
            const walletIcon = WALLET_ICONS[state.walletType] || '🔗';
            document.getElementById('connectedWalletIcon').textContent = walletIcon;
            document.getElementById('connectedWalletName').textContent = 
                state.walletName || '钱包已连接';

            // Display address
            const addr = state.address;
            document.getElementById('walletAddress').textContent =
                addr.substring(0, 6) + '...' + addr.substring(addr.length - 4);

            // Get balance
            try {
                const balance = await BoonLinkWallet.getBalance('USDT');
                document.getElementById('usdtBalance').textContent = balance + ' USDT';
            } catch (e) {
                document.getElementById('usdtBalance').textContent = '--';
            }

            // Get limit status
            if (typeof BoonLinkLimits !== 'undefined') {
                const limitStatus = BoonLinkLimits.getLimitStatus();
                document.getElementById('remainingLimit').textContent =
                    '฿' + limitStatus.remainingDaily.toLocaleString();
            }
        }

        // Initialize
        init();
    </script>
</body>
</html>
