<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#191919">
    <title>离线支付 - BoonLink</title>
    <link rel="stylesheet" href="/shared/css/wechat-dark.css">
    <style>
        .amount-input-area {
            background: var(--bg-secondary);
            border-radius: 16px;
            margin: 16px;
            padding: 24px;
            text-align: center;
        }
        .amount-label {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .amount-display {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 4px;
        }
        .currency-symbol {
            font-size: 28px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .amount-value {
            font-size: 48px;
            font-weight: 600;
            color: var(--text-primary);
            background: none;
            border: none;
            text-align: center;
            width: 180px;
            outline: none;
            font-family: inherit;
        }
        .amount-value::placeholder { color: var(--text-tertiary); }
        
        .note-card {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 16px 16px;
            padding: 14px 16px;
            background: var(--bg-secondary);
            border-radius: 10px;
            cursor: pointer;
        }
        .note-icon { font-size: 18px; }
        .note-text {
            flex: 1;
            font-size: 14px;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .note-text.has-note { color: var(--text-primary); }
        .note-arrow { font-size: 20px; color: var(--text-tertiary); }
        
        .generate-btn {
            display: block;
            margin: 0 16px 16px;
            padding: 16px;
            background: linear-gradient(135deg, #AF52DE 0%, #8B3EBF 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            width: calc(100% - 32px);
        }
        .generate-btn:active { opacity: 0.9; }
        .generate-btn:disabled { background: var(--bg-tertiary); color: var(--text-tertiary); }
        .generate-btn.loading { opacity: 0.7; pointer-events: none; }
        
        .wallet-status {
            margin: 0 16px 16px;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .wallet-status.connected { border-left: 3px solid var(--accent-green); }
        .wallet-status.disconnected { border-left: 3px solid #FF3B30; }
        .wallet-icon { font-size: 20px; }
        .wallet-info { flex: 1; }
        .wallet-label { font-size: 12px; color: var(--text-tertiary); }
        .wallet-address { font-size: 14px; color: var(--text-primary); font-family: monospace; }
        
        .qr-container {
            display: none;
            flex-direction: column;
            align-items: center;
            margin: 16px;
            padding: 24px;
            background: var(--bg-secondary);
            border-radius: 16px;
        }
        .qr-container.show { display: flex; }
        .qr-title { font-size: 18px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; }
        .qr-hint { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; }
        .qr-box { background: white; padding: 16px; border-radius: 12px; }
        #qrCanvas { display: block; }
        .qr-amount { margin-top: 20px; font-size: 32px; font-weight: 600; color: var(--accent-green); }
        .qr-expire { margin-top: 8px; font-size: 13px; color: var(--text-tertiary); }
        .qr-countdown { color: #FF9500; font-weight: 600; }
        .qr-signature { margin-top: 12px; font-size: 11px; color: var(--text-tertiary); word-break: break-all; max-width: 280px; text-align: center; }
        .regenerate-btn {
            margin-top: 20px;
            padding: 12px 32px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 15px;
            cursor: pointer;
        }
        
        .note-modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 1000; display: none;
        }
        .note-modal-overlay.show { display: flex; align-items: flex-end; justify-content: center; }
        .note-modal {
            width: 100%; max-width: 428px;
            background: var(--bg-secondary);
            border-radius: 16px 16px 0 0;
            padding-bottom: env(safe-area-inset-bottom, 0);
        }
        .note-modal-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 16px; border-bottom: 1px solid var(--border-color);
        }
        .note-modal-title { font-size: 16px; font-weight: 600; color: var(--text-primary); }
        .note-modal-close { background: none; border: none; font-size: 18px; color: var(--text-secondary); cursor: pointer; padding: 4px 8px; }
        .note-modal-body { padding: 16px; }
        .note-textarea {
            width: 100%; height: 90px; padding: 12px;
            border: 1px solid var(--border-color); border-radius: 10px;
            background: var(--bg-input); color: var(--text-primary);
            font-size: 15px; resize: none; font-family: inherit; box-sizing: border-box;
        }
        .note-textarea:focus { outline: none; border-color: var(--accent-green); }
        .note-modal-footer { display: flex; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--border-color); }
        .note-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .note-btn-cancel { background: var(--bg-card); color: var(--text-primary); }
        .note-btn-confirm { background: var(--accent-green); color: white; }
        
        .numpad-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 500; display: none; }
        .numpad-overlay.show { display: block; }
        .numpad-container {
            position: fixed; bottom: 0; left: 0; right: 0;
            max-width: 428px; margin: 0 auto;
            transform: translateY(100%); transition: transform 0.25s ease-out; z-index: 501;
        }
        .numpad-container.show { transform: translateY(0); }
        .numpad-inner { background: #2C2C2E; border-radius: 16px 16px 0 0; padding: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0)); }
        .numpad-row { display: flex; gap: 6px; margin-bottom: 6px; }
        .numpad-row:last-child { margin-bottom: 0; }
        .numpad-key {
            flex: 1; height: 54px; border: none; border-radius: 8px;
            font-size: 24px; font-weight: 400;
            background: #636366; color: white; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .numpad-key:active { background: #8E8E93; }
        .numpad-key.action { background: #48484A; font-size: 18px; }
        .numpad-key.confirm { background: var(--accent-green); }
        .numpad-key.confirm:active { background: #05a050; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="wc-header">
            <button class="wc-header-btn" onclick="goBack()">✕</button>
            <div class="wc-header-title" id="pageTitle">离线支付</div>
            <button class="wc-header-btn">⋯</button>
        </div>
        
        <div id="inputSection">
            <div class="wallet-status" id="walletStatus">
                <span class="wallet-icon">💳</span>
                <div class="wallet-info">
                    <div class="wallet-label" id="walletLabel">钱包地址</div>
                    <div class="wallet-address" id="walletAddress">未连接</div>
                </div>
            </div>
            
            <div class="amount-input-area" onclick="showNumpad()">
                <div class="amount-label" id="amountLabel">输入金额</div>
                <div class="amount-display">
                    <span class="currency-symbol">฿</span>
                    <input type="text" class="amount-value" id="amountInput" readonly placeholder="0" onclick="event.stopPropagation(); showNumpad();">
                </div>
            </div>
            
            <div class="note-card" onclick="openNoteModal()">
                <span class="note-icon">📝</span>
                <span class="note-text" id="noteDisplay">添加备注</span>
                <span class="note-arrow">›</span>
            </div>
            
            <button class="generate-btn" id="generateBtn" onclick="generateQR()" disabled>
                <span id="generateBtnText">生成付款码 (EIP-712)</span>
            </button>
        </div>
        
        <div class="qr-container" id="qrSection">
            <div class="qr-title" id="qrTitle">请让商家扫码收款</div>
            <div class="qr-hint" id="qrHint">付款码有效期5分钟</div>
            <div class="qr-box">
                <canvas id="qrCanvas" width="200" height="200"></canvas>
            </div>
            <div class="qr-amount" id="qrAmount">฿0</div>
            <div class="qr-expire">
                <span id="expireLabel">有效期</span>: <span class="qr-countdown" id="countdown">5:00</span>
            </div>
            <div class="qr-signature" id="signatureInfo">EIP-712 签名验证</div>
            <button class="regenerate-btn" onclick="resetToInput()" id="regenerateBtn">重新生成</button>
        </div>
        
        <div class="numpad-overlay" id="numpadOverlay" onclick="hideNumpad()"></div>
        <div class="numpad-container" id="numpadContainer">
            <div class="numpad-inner">
                <div class="numpad-row">
                    <button class="numpad-key" onclick="inputDigit('1')">1</button>
                    <button class="numpad-key" onclick="inputDigit('2')">2</button>
                    <button class="numpad-key" onclick="inputDigit('3')">3</button>
                </div>
                <div class="numpad-row">
                    <button class="numpad-key" onclick="inputDigit('4')">4</button>
                    <button class="numpad-key" onclick="inputDigit('5')">5</button>
                    <button class="numpad-key" onclick="inputDigit('6')">6</button>
                </div>
                <div class="numpad-row">
                    <button class="numpad-key" onclick="inputDigit('7')">7</button>
                    <button class="numpad-key" onclick="inputDigit('8')">8</button>
                    <button class="numpad-key" onclick="inputDigit('9')">9</button>
                </div>
                <div class="numpad-row">
                    <button class="numpad-key" onclick="inputDigit('.')">.</button>
                    <button class="numpad-key" onclick="inputDigit('0')">0</button>
                    <button class="numpad-key action" onclick="backspace()">⌫</button>
                </div>
                <div class="numpad-row">
                    <button class="numpad-key action" onclick="hideNumpad()" id="cancelBtn">取消</button>
                    <button class="numpad-key confirm" onclick="confirmAmount()" id="confirmBtn">确认</button>
                </div>
            </div>
        </div>
        
        <div class="note-modal-overlay" id="noteModalOverlay" onclick="closeNoteModal()">
            <div class="note-modal" onclick="event.stopPropagation()">
                <div class="note-modal-header">
                    <span class="note-modal-title" id="noteModalTitle">添加备注</span>
                    <button class="note-modal-close" onclick="closeNoteModal()">✕</button>
                </div>
                <div class="note-modal-body">
                    <textarea class="note-textarea" id="noteTextarea" placeholder="请输入备注..." maxlength="50"></textarea>
                </div>
                <div class="note-modal-footer">
                    <button class="note-btn note-btn-cancel" onclick="closeNoteModal()" id="noteCancelBtn">取消</button>
                    <button class="note-btn note-btn-confirm" onclick="saveNote()" id="noteConfirmBtn">确认</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // ============================================
        // Embedded Offline QR Code Generator (no external dependencies)
        // Based on qr.js - Pure JavaScript QR Code Generator
        // ============================================
        (function(){

            QRCode.createData=function(typeNumber,errorCorrectLevel,dataList){var rsBlocks=QRRSBlock.getRSBlocks(typeNumber,errorCorrectLevel);var buffer=new QRBitBuffer();for(var i=0;i<dataList.length;i++){var data=dataList[i];buffer.put(data.mode,4);buffer.put(data.getLength(),QRUtil.getLengthInBits(data.mode,typeNumber));data.write(buffer);}var totalDataCount=0;for(var i=0;i<rsBlocks.length;i++){totalDataCount+=rsBlocks[i].dataCount;}if(buffer.getLengthInBits()>totalDataCount*8){throw new Error("code length overflow. ("+buffer.getLengthInBits()+">"+totalDataCount*8+")");}if(buffer.getLengthInBits()+4<=totalDataCount*8){buffer.put(0,4);}while(buffer.getLengthInBits()%8!=0){buffer.putBit(false);}while(true){if(buffer.getLengthInBits()>=totalDataCount*8){break;}buffer.put(236,8);if(buffer.getLengthInBits()>=totalDataCount*8){break;}buffer.put(17,8);}return QRCode.createBytes(buffer,rsBlocks);};

        const QRCodeGenerator = {
            async generate(canvas, text, size) {
                size = size || 200;
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                
                console.log('🔄 Starting QR generation, data length:', text.length);
                
                // Method 1: Embedded offline QR generator (works without network!)
                if (typeof QRCodeOffline !== 'undefined') {
                    try {
                        QRCodeOffline.toCanvas(canvas, text, {
                            width: size,
                            margin: 4,
                            errorCorrectionLevel: 'L',
                            color: { dark: '#000000', light: '#ffffff' }
                        });
                        console.log('✅ QR generated using OFFLINE embedded generator');
                        return;
                    } catch (e) {
                        console.warn('Offline QR generator failed:', e);
                    }
                }
                
                // Method 2: CDN QRCode library (if loaded)
                if (typeof QRCode !== 'undefined' && QRCode.toCanvas) {
                    try {
                        await QRCode.toCanvas(canvas, text, {
                            width: size,
                            margin: 1,
                            errorCorrectionLevel: 'L',
                            color: { dark: '#000000', light: '#ffffff' }
                        });
                        console.log('✅ QR generated using CDN QRCode library');
                        return;
                    } catch (e) {
                        console.warn('QRCode library failed:', e);
                    }
                }
                
                // Method 3: API with image (requires network)
                console.log('🔄 Trying API method...');
                const apis = [
                    `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(text)}&format=png&ecc=L`,
                    `https://quickchart.io/qr?text=${encodeURIComponent(text)}&size=${size}&margin=1`
                ];
                
                for (const apiUrl of apis) {
                    try {
                        const img = await this.loadImage(apiUrl);
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, size, size);
                        ctx.drawImage(img, 0, 0, size, size);
                        console.log('✅ QR generated using API');
                        return;
                    } catch (e) {
                        console.warn('API failed:', apiUrl, e);
                    }
                }
                
                // Method 4: Show error (all methods failed)
                console.error('❌ All QR methods failed');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, size, size);
                ctx.fillStyle = '#000000';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('QR生成失败', size/2, size/2 - 10);
                ctx.fillText('请重试', size/2, size/2 + 10);
                throw new Error('QR码生成失败');

            loadImage(url) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => resolve(img);
                    img.onerror = () => reject(new Error('Image load failed'));
                    // Timeout after 5 seconds
                    setTimeout(() => reject(new Error('Image load timeout')), 5000);
                    img.src = url;
                });
            }

        function applyTranslations() {
            document.getElementById('pageTitle').textContent = t('pageTitle');
            document.getElementById('walletLabel').textContent = t('walletLabel');
            document.getElementById('amountLabel').textContent = t('amountLabel');
            if (!noteText) document.getElementById('noteDisplay').textContent = t('noteHint');
            document.getElementById('generateBtnText').textContent = t('generateBtn');
            document.getElementById('qrTitle').textContent = t('qrTitle');
            document.getElementById('qrHint').textContent = t('qrHint');
            document.getElementById('expireLabel').textContent = t('expireLabel');
            document.getElementById('regenerateBtn').textContent = t('regenerateBtn');
            document.getElementById('noteModalTitle').textContent = t('noteModalTitle');
            document.getElementById('cancelBtn').textContent = t('cancel');
            document.getElementById('confirmBtn').textContent = t('confirm');
            document.getElementById('noteCancelBtn').textContent = t('cancel');
            document.getElementById('noteConfirmBtn').textContent = t('confirm');
            updateWalletDisplay();
        }
        
        // ============================================
        // Wallet
        // ============================================
        async function checkWalletConnection() {
            walletAddress = localStorage.getItem('connectedWallet');
            if (window.ethereum) {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                    if (accounts?.length) {
                        walletAddress = accounts[0];
                        localStorage.setItem('connectedWallet', walletAddress);
                    }
                } catch (e) {}
            }
            updateWalletDisplay();
        }
        
        function updateWalletDisplay() {
            const statusEl = document.getElementById('walletStatus');
            const addressEl = document.getElementById('walletAddress');
            if (walletAddress) {
                statusEl.classList.add('connected');
                statusEl.classList.remove('disconnected');
                addressEl.textContent = walletAddress.slice(0, 6) + '...' + walletAddress.slice(-4);
            } else {
                statusEl.classList.remove('connected');
                statusEl.classList.add('disconnected');
                addressEl.textContent = t('notConnected');
            }
        }
        
        // ============================================
        // Navigation & Numpad
        // ============================================
        function goBack() {
            if (document.getElementById('qrSection').classList.contains('show')) {
                resetToInput();
            } else {
                window.location.href = '/customer/index.html';
            }
        }
        
        function showNumpad() {
            document.getElementById('numpadOverlay').classList.add('show');
            document.getElementById('numpadContainer').classList.add('show');
        }
        function hideNumpad() {
            document.getElementById('numpadOverlay').classList.remove('show');
            document.getElementById('numpadContainer').classList.remove('show');
        }
        function inputDigit(d) {
            if (d === '.' && amountStr.includes('.')) return;
            if (amountStr === '0' && d !== '.') amountStr = '';
            if (amountStr.includes('.') && amountStr.split('.')[1].length >= 2) return;
            if (amountStr.length >= 10) return;
            amountStr += d;
            updateAmountDisplay();
        }
        function backspace() { amountStr = amountStr.slice(0, -1); updateAmountDisplay(); }
        function updateAmountDisplay() {
            document.getElementById('amountInput').value = amountStr || '';
            document.getElementById('generateBtn').disabled = (parseFloat(amountStr) || 0) <= 0;
        }
        function confirmAmount() { hideNumpad(); }
        
        // ============================================
        // Note Modal
        // ============================================
        function openNoteModal() {
            document.getElementById('noteTextarea').value = noteText;
            document.getElementById('noteModalOverlay').classList.add('show');
            setTimeout(() => document.getElementById('noteTextarea').focus(), 100);
        }
        function closeNoteModal() { document.getElementById('noteModalOverlay').classList.remove('show'); }
        function saveNote() {
            noteText = document.getElementById('noteTextarea').value.trim();
            const noteDisplay = document.getElementById('noteDisplay');
            if (noteText) {
                noteDisplay.textContent = noteText;
                noteDisplay.classList.add('has-note');
            } else {
                noteDisplay.textContent = t('noteHint');
                noteDisplay.classList.remove('has-note');
            }
            closeNoteModal();
        }
        
        // ============================================
        // Generate QR with EIP-712
        // ============================================
        async function generateQR() {
            const amount = parseFloat(amountStr) || 0;
            if (amount <= 0) return;
            
            const btn = document.getElementById('generateBtn');
            const btnText = document.getElementById('generateBtnText');
            btn.classList.add('loading');
            btnText.textContent = t('generating');
            
            try {
                const orderId = 'BL' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).substring(2, 6).toUpperCase();
                const timestamp = Date.now();
                const deadline = Math.floor(timestamp / 1000) + 300;
                const nonce = Math.floor(Math.random() * 1000000);
                
                const paymentData = { orderId, amountTHB: amount, note: noteText || '', timestamp, deadline, nonce };
                
                let qrPayload, signerAddress = walletAddress, signatureShort = '';
                
                // Try EIP-712 signature
                if (window.ethereum) {
                    try {
                        const result = await EIP712.signPayment(paymentData);
                        qrPayload = {
                            type: 'BOONLINK_PAYMENT',
                            version: '2.0',
                            data: {
                                ...paymentData,
                                signer: result.signer,
                                signature: result.signature,
                                chainId: 56,
                                paymentType: 'eip712'
                            }
                        };
                        signerAddress = result.signer;
                        signatureShort = result.signature.slice(0, 10) + '...' + result.signature.slice(-6);
                    } catch (e) {
                        if (e.code === 4001) {
                            alert(t('userRejected'));
                            btn.classList.remove('loading');
                            btnText.textContent = t('generateBtn');
                            return;
                        }
                        // Fallback to unsigned
                        qrPayload = {
                            type: 'BOONLINK_PAYMENT',
                            version: '2.0',
                            data: { ...paymentData, signer: signerAddress || 'unsigned', signature: null, chainId: 56, paymentType: 'unsigned' }
                        };
                        signatureShort = '(unsigned)';
                    }
                } else {
                    // No wallet - offline mode
                    qrPayload = {
                        type: 'BOONLINK_PAYMENT',
                        version: '2.0',
                        data: { ...paymentData, signer: signerAddress || 'offline', signature: null, chainId: 56, paymentType: 'offline' }
                    };
                    signatureShort = '(offline)';
                }
                
                // Generate QR
                const canvas = document.getElementById('qrCanvas');
                const qrDataStr = JSON.stringify(qrPayload);
                console.log('📱 Generating QR with data length:', qrDataStr.length);
                console.log('📦 QR Payload:', qrPayload);
                
                try {
                    await QRCodeGenerator.generate(canvas, qrDataStr, 200);
                } catch (qrError) {
                    console.error('QR generation failed:', qrError);
                    alert('二维码生成失败: ' + qrError.message);
                    btn.classList.remove('loading');
                    btnText.textContent = t('generateBtn');
                    return;
                }
                
                // Show QR
                document.getElementById('inputSection').style.display = 'none';
                document.getElementById('qrSection').classList.add('show');
                document.getElementById('qrAmount').textContent = '฿' + amount.toLocaleString();
                document.getElementById('signatureInfo').textContent = qrPayload.data.signature ? t('signatureVerified') + ' ' + signatureShort : signatureShort;
                
                secondsLeft = 300;
                startCountdown();
            } catch (e) {
                console.error('Payment error:', e);
                alert(t('signFailed') + ': ' + e.message);
            } finally {
                btn.classList.remove('loading');
                btnText.textContent = t('generateBtn');
            }
        }
        
        function startCountdown() {
            updateCountdown();
            countdownTimer = setInterval(() => {
                secondsLeft--;
                if (secondsLeft <= 0) { clearInterval(countdownTimer); resetToInput(); return; }
                updateCountdown();
            }, 1000);
        }
        
        function updateCountdown() {
            const m = Math.floor(secondsLeft / 60), s = secondsLeft % 60;
            document.getElementById('countdown').textContent = `${m}:${s.toString().padStart(2, '0')}`;
        }
        
        function resetToInput() {
            if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
            amountStr = ''; noteText = '';
            document.getElementById('amountInput').value = '';
            document.getElementById('noteDisplay').textContent = t('noteHint');
            document.getElementById('noteDisplay').classList.remove('has-note');
            document.getElementById('generateBtn').disabled = true;
            document.getElementById('inputSection').style.display = 'block';
            document.getElementById('qrSection').classList.remove('show');
        }
        
        // Init
        checkWalletConnection();
        applyTranslations();
    </script>
</body>
</html>
