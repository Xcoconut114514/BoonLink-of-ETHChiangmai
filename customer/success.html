<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#191919">
    <title>支付成功 - BoonLink</title>
    <link rel="stylesheet" href="/shared/css/wechat-dark.css">
</head>
<body>
    <div class="app-container wc-success-page">
        <!-- Success Header -->
        <div class="wc-success-header">
            <div class="wc-success-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
            <div class="wc-success-title">支付成功</div>
            <div class="wc-success-merchant" id="merchantName">PromptPay 商户</div>
            <div class="wc-success-amount">
                <span class="currency">¥</span><span id="cryptoAmount">1.13</span>
            </div>
        </div>

        <!-- Details -->
        <div class="wc-details">
            <div class="wc-detail-row">
                <span class="wc-detail-label">标价</span>
                <span class="wc-detail-value" id="thbAmount">40.00泰铢</span>
            </div>
            <div class="wc-detail-row">
                <span class="wc-detail-label">市场汇率</span>
                <span class="wc-detail-value" id="marketRate">1USDT=35.50泰铢</span>
            </div>
            <div class="wc-detail-row">
                <span class="wc-detail-label">优惠</span>
                <span class="wc-detail-value highlight" id="discountRate">1USDT=35.40泰铢</span>
            </div>
        </div>

        <!-- Complete Button -->
        <button class="wc-complete-btn" onclick="showReceipt()">完成</button>

        <!-- Hint -->
        <div class="wc-hint">
            <span class="wc-hint-icon">💡</span>
            请点击「完成」查看商家收款结果
        </div>
    </div>

    <script>
        // Get payment info from localStorage
        const merchantName = localStorage.getItem('merchantName') || 'PromptPay 商户';
        const cryptoAmount = localStorage.getItem('cryptoAmount') || '0.00';
        const amountTHB = localStorage.getItem('amountTHB') || '0';
        const txHash = localStorage.getItem('txHash') || '';
        const tokenSymbol = localStorage.getItem('tokenSymbol') || 'USDT';
        const paymentTime = localStorage.getItem('paymentTime') || new Date().toISOString();
        const merchantId = localStorage.getItem('merchantId') || '';

        // Save to transaction history
        const txRecord = {
            txHash: txHash,
            merchantName: merchantName,
            thbAmount: parseFloat(amountTHB) || 0,
            cryptoAmount: cryptoAmount,
            token: tokenSymbol,
            time: paymentTime
        };
        const history = JSON.parse(localStorage.getItem('txHistory') || '[]');
        // Avoid duplicate entries
        if (!history.find(tx => tx.txHash === txHash)) {
            history.unshift(txRecord);
            localStorage.setItem('txHistory', JSON.stringify(history));
        }
        
        // Notify merchant via API (so merchant can receive notification)
        async function notifyMerchant() {
            try {
                const orderData = {
                    orderId: 'BL_' + Date.now(),
                    txHash: txHash,
                    amountTHB: parseFloat(amountTHB) || 0,
                    cryptoAmount: cryptoAmount,
                    token: tokenSymbol,
                    merchantId: merchantId,
                    merchantName: merchantName,
                    timestamp: Date.now()
                };
                
                // Store in shared storage for merchant polling
                const pendingOrders = JSON.parse(localStorage.getItem('pendingMerchantOrders') || '[]');
                pendingOrders.push(orderData);
                localStorage.setItem('pendingMerchantOrders', JSON.stringify(pendingOrders));
                
                console.log('📤 Order saved for merchant:', orderData);
            } catch (e) {
                console.error('Notify merchant failed:', e);
            }
        }
        notifyMerchant();

        // Display info
        document.getElementById('merchantName').textContent = merchantName;
        document.getElementById('cryptoAmount').textContent = parseFloat(cryptoAmount).toFixed(2);
        document.getElementById('thbAmount').textContent = `${parseFloat(amountTHB).toFixed(2)}泰铢`;

        // Calculate rates
        const thb = parseFloat(amountTHB);
        const crypto = parseFloat(cryptoAmount);
        if (crypto > 0) {
            const marketRate = 35.50;
            const actualRate = (thb / crypto).toFixed(2);
            document.getElementById('marketRate').textContent = `1${tokenSymbol}=${marketRate}泰铢`;
            document.getElementById('discountRate').textContent = `1${tokenSymbol}=${actualRate}泰铢`;
        }

        // Play success voice announcement - improved for mobile
        async function playSuccessVoice() {
            console.log('🔊 Attempting to play success voice...');
            
            if (!('speechSynthesis' in window)) {
                console.warn('Speech synthesis not supported');
                return;
            }
            
            // Wait for voices to load
            let voices = window.speechSynthesis.getVoices();
            if (voices.length === 0) {
                await new Promise(resolve => {
                    window.speechSynthesis.onvoiceschanged = () => {
                        voices = window.speechSynthesis.getVoices();
                        resolve();
                    };
                    setTimeout(resolve, 1000); // Timeout fallback
                });
            }
            
            const lang = localStorage.getItem('boonlink_lang') || 'zh';
            const amount = Math.round(parseFloat(amountTHB) || 0);
            
            const voiceTexts = {
                zh: `支付成功 ${amount} 泰铢`,
                en: `Payment successful. ${amount} Baht`,
                th: `ชำระเงินสำเร็จ ${amount} บาท`
            };
            
            const langCodes = { zh: 'zh-CN', en: 'en-US', th: 'th-TH' };
            
            const text = voiceTexts[lang] || voiceTexts.zh;
            console.log('🔊 Voice text:', text, 'Language:', lang);
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = langCodes[lang] || 'zh-CN';
            utterance.rate = 0.9;
            utterance.volume = 1.0;
            
            // Find appropriate voice
            const langPrefix = (langCodes[lang] || 'zh-CN').split('-')[0];
            const voice = voices.find(v => v.lang.startsWith(langPrefix)) || 
                          voices.find(v => v.lang.includes(langPrefix));
            if (voice) {
                utterance.voice = voice;
                console.log('🔊 Selected voice:', voice.name);
            }
            
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
            
            // Haptic feedback
            if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100]);
            }
        }
        
        // Auto-play voice on page load
        playSuccessVoice();

        function showReceipt() {
            window.location.href = '/customer/receipt.html';
        }
    </script>
</body>
</html>
