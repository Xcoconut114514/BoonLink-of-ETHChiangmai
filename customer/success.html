<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#EDEDED">
    <title>支付成功 - BoonLink</title>
    <link rel="stylesheet" href="../shared/css/common.css">
</head>
<body>
    <div class="app-container">
        <!-- Success Header -->
        <div class="success-container" style="margin: 0; border-radius: 0;">
            <div class="success-icon">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
            <div class="success-title">支付成功</div>
            <div class="success-merchant" id="merchantName">PromptPay 商户</div>
            <div class="success-amount" id="amountCrypto">1.13 USDT</div>
        </div>

        <!-- Details -->
        <div class="app-content" style="padding-top: 0;">
            <div class="details-list" style="margin-top: 16px;">
                <div class="detail-item">
                    <span class="detail-label">标价</span>
                    <span class="detail-value" id="amountTHB">฿40.00 THB</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">市场汇率</span>
                    <span class="detail-value" id="marketRate">1 USDT = 35.50 THB</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">优惠汇率</span>
                    <span class="detail-value highlight" id="discountRate">1 USDT = 35.40 THB</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">节省</span>
                    <span class="detail-value success" id="savings">฿0.28</span>
                </div>
            </div>

            <!-- Transaction Hash -->
            <div class="tx-hash" onclick="viewOnExplorer()">
                <div class="tx-label">交易哈希</div>
                <div class="tx-value" id="txHash">0x1a2b...3c4d</div>
                <div class="tx-hint">点击在区块链浏览器中查看</div>
            </div>

            <!-- Transaction Details Card -->
            <div class="card" style="margin-top: 12px;">
                <div class="card-header">交易详情</div>
                <div class="details-list" style="margin: 0 -16px -16px; background: transparent; box-shadow: none;">
                    <div class="detail-item">
                        <span class="detail-label">支付方式</span>
                        <span class="detail-value" id="tokenSymbol">USDT (BSC)</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">网络费用</span>
                        <span class="detail-value success">< $0.01</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">时间</span>
                        <span class="detail-value" id="timestamp">2025-01-30 14:30:25</span>
                    </div>
                    <div class="detail-item" id="noteItem" style="display: none;">
                        <span class="detail-label">备注</span>
                        <span class="detail-value" id="paymentNote" style="color: var(--text-primary);"></span>
                    </div>
                    <div class="detail-item" style="border: none;">
                        <span class="detail-label">订单号</span>
                        <span class="detail-value" id="orderId">BL20250130001</span>
                    </div>
                </div>
            </div>

            <!-- Complete Button -->
            <button class="btn btn-primary btn-large" onclick="goToMerchant()" style="margin-top: 24px;">
                完成
            </button>

            <!-- Hint -->
            <div class="hint">
                <span class="hint-icon">💡</span>
                <span class="hint-text">点击「完成」可查看商家收款凭证，方便出示给商家确认</span>
            </div>
        </div>
    </div>

    <style>
        .success-container {
            background: linear-gradient(135deg, #667EEA 0%, #07C160 100%);
            color: white;
            text-align: center;
            padding: 48px 20px 32px;
        }

        .success-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            animation: scaleIn 0.4s ease-out;
        }

        .success-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .success-merchant {
            font-size: 15px;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        .success-amount {
            font-size: 40px;
            font-weight: 300;
            letter-spacing: -1px;
        }

        @keyframes scaleIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .tx-hash {
            cursor: pointer;
            transition: background 0.2s;
        }

        .tx-hash:active {
            background: var(--bg-input);
        }

        .tx-hint {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-top: 4px;
        }
    </style>

    <script>
        // Get payment data from localStorage
        const merchantName = localStorage.getItem('merchantName') || 'PromptPay 商户';
        const amountTHB = parseFloat(localStorage.getItem('amountTHB')) || 40;
        const selectedToken = localStorage.getItem('selectedToken') || 'USDT';
        const amountCrypto = parseFloat(localStorage.getItem('amountCrypto')) || 1.13;
        const exchangeRate = parseFloat(localStorage.getItem('exchangeRate')) || 35.40;
        const paymentNote = localStorage.getItem('paymentNote') || '';

        // Update display
        document.getElementById('merchantName').textContent = merchantName;
        document.getElementById('amountTHB').textContent = `฿${amountTHB.toFixed(2)} THB`;

        // Show note if exists
        if (paymentNote) {
            document.getElementById('noteItem').style.display = 'flex';
            document.getElementById('paymentNote').textContent = paymentNote;
        }

        // Format crypto amount based on token
        const cryptoFormatted = selectedToken === 'ETH'
            ? amountCrypto.toFixed(6)
            : amountCrypto.toFixed(2);
        document.getElementById('amountCrypto').textContent = `${cryptoFormatted} ${selectedToken}`;

        // Update token symbol
        document.getElementById('tokenSymbol').textContent = `${selectedToken} (BSC)`;

        // Update rates
        const marketRate = selectedToken === 'ETH' ? 120500 : 35.50;
        const discountRate = exchangeRate;

        if (selectedToken === 'ETH') {
            document.getElementById('marketRate').textContent = `1 ETH = ${marketRate.toLocaleString()} THB`;
            document.getElementById('discountRate').textContent = `1 ETH = ${discountRate.toLocaleString()} THB`;
        } else {
            document.getElementById('marketRate').textContent = `1 ${selectedToken} = ${marketRate.toFixed(2)} THB`;
            document.getElementById('discountRate').textContent = `1 ${selectedToken} = ${discountRate.toFixed(2)} THB`;
        }

        // Calculate savings
        const marketAmount = amountTHB / marketRate;
        const actualAmount = amountTHB / discountRate;
        const savingsAmount = (marketAmount - actualAmount) * discountRate;
        document.getElementById('savings').textContent = `฿${Math.abs(savingsAmount).toFixed(2)}`;

        // Generate mock transaction hash
        const txHash = '0x' + Math.random().toString(16).substr(2, 8) + '...' + Math.random().toString(16).substr(2, 4);
        document.getElementById('txHash').textContent = txHash;

        // Current timestamp
        const now = new Date();
        const timestamp = now.toLocaleString('zh-CN', {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false
        });
        document.getElementById('timestamp').textContent = timestamp;

        // Generate order ID
        const dateStr = now.toISOString().slice(0, 10).replace(/-/g, '');
        const randomNum = Math.floor(Math.random() * 1000).toString().padStart(3, '0');
        const orderId = `BL${dateStr}${randomNum}`;
        document.getElementById('orderId').textContent = orderId;

        // Save for merchant page
        localStorage.setItem('txHash', txHash);
        localStorage.setItem('timestamp', timestamp);
        localStorage.setItem('orderId', orderId);

        function viewOnExplorer() {
            // Haptic feedback
            if (navigator.vibrate) {
                navigator.vibrate(5);
            }

            // In real app, open BSCScan
            const fullHash = txHash.replace('...', '0000');
            const url = `https://bscscan.com/tx/${fullHash}`;

            // Show modal or redirect
            if (confirm(`打开区块链浏览器查看交易详情？\n\n${url}`)) {
                window.open(url, '_blank');
            }
        }

        function goToMerchant() {
            // Haptic feedback
            if (navigator.vibrate) {
                navigator.vibrate(10);
            }

            window.location.href = 'merchant.html';
        }

        // Success animation on load
        window.addEventListener('load', () => {
            // Haptic feedback for success
            if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100]);
            }
        });
    </script>
</body>
</html>
