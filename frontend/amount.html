<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>输入金额 - BoonLink</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="app-header">
            <div class="header-left">
                <button class="icon-btn" onclick="window.history.back()">✕</button>
            </div>
            <div class="header-title">BoonLink</div>
            <div class="header-right">
                <button class="icon-btn">···</button>
            </div>
        </div>

        <!-- Merchant Info -->
        <div class="merchant-info">
            <div class="merchant-label">付款给商户</div>
            <div class="merchant-name" id="merchantName">TUNGNGERN（）</div>
        </div>

        <!-- Amount Display Card -->
        <div class="card" style="margin: 20px 16px;">
            <div class="card-header">付款金额</div>
            <div class="amount-display" style="padding: 20px 0;">
                <div class="amount-value" id="amountDisplay">THB 40</div>
                <div class="amount-underline"></div>
            </div>
        </div>

        <!-- Logo -->
        <div style="text-align: center; padding: 40px 0;">
            <div class="logo-icon" style="font-size: 40px;">🔗</div>
            <div style="font-size: 16px; color: var(--text-secondary); margin-top: 8px;">BoonLink</div>
        </div>

        <!-- Spacer to push numpad to bottom -->
        <div style="flex-grow: 1;"></div>

        <!-- Number Pad -->
        <div class="numpad-container" style="position: fixed; bottom: 0; left: 0; right: 0; max-width: 428px; margin: 0 auto;">
            <button class="numpad-key" onclick="addDigit('1')">1</button>
            <button class="numpad-key" onclick="addDigit('2')">2</button>
            <button class="numpad-key" onclick="addDigit('3')">3</button>
            <button class="numpad-key delete" onclick="deleteDigit()">⌫</button>

            <button class="numpad-key" onclick="addDigit('4')">4</button>
            <button class="numpad-key" onclick="addDigit('5')">5</button>
            <button class="numpad-key" onclick="addDigit('6')">6</button>
            <button class="numpad-pay" id="payButton" onclick="proceedToTokenSelection()">
                付款
            </button>

            <button class="numpad-key" onclick="addDigit('7')">7</button>
            <button class="numpad-key" onclick="addDigit('8')">8</button>
            <button class="numpad-key" onclick="addDigit('9')">9</button>

            <button class="numpad-key wide" onclick="addDigit('0')">0</button>
            <button class="numpad-key" onclick="addDigit('.')">.</button>
        </div>
    </div>

    <script>
        // Get merchant info from URL or localStorage
        const urlParams = new URLSearchParams(window.location.search);
        const merchantName = urlParams.get('merchant') || localStorage.getItem('merchantName') || 'TUNGNGERN（）';
        let currentAmount = urlParams.get('amount') || '40';

        // Set merchant name
        document.getElementById('merchantName').textContent = merchantName;

        // Update display
        function updateDisplay() {
            const display = document.getElementById('amountDisplay');
            const formatted = formatAmount(currentAmount);
            display.textContent = `THB ${formatted}`;

            // Enable/disable pay button
            const payButton = document.getElementById('payButton');
            if (parseFloat(currentAmount) > 0) {
                payButton.style.opacity = '1';
                payButton.disabled = false;
            } else {
                payButton.style.opacity = '0.5';
                payButton.disabled = true;
            }
        }

        function formatAmount(amount) {
            if (!amount || amount === '0') return '0';

            // Handle decimal point
            const parts = amount.split('.');
            const integerPart = parts[0] || '0';
            const decimalPart = parts[1];

            if (decimalPart !== undefined) {
                return `${integerPart}.${decimalPart}`;
            }
            return integerPart;
        }

        function addDigit(digit) {
            // Haptic feedback
            if (navigator.vibrate) {
                navigator.vibrate(5);
            }

            if (digit === '.') {
                if (currentAmount.includes('.')) return;
                if (!currentAmount) currentAmount = '0';
                currentAmount += '.';
            } else {
                if (currentAmount === '0') {
                    currentAmount = digit;
                } else {
                    // Limit to 2 decimal places
                    if (currentAmount.includes('.')) {
                        const parts = currentAmount.split('.');
                        if (parts[1].length >= 2) return;
                    }
                    currentAmount += digit;
                }
            }

            updateDisplay();
        }

        function deleteDigit() {
            // Haptic feedback
            if (navigator.vibrate) {
                navigator.vibrate(5);
            }

            if (currentAmount.length > 1) {
                currentAmount = currentAmount.slice(0, -1);
            } else {
                currentAmount = '0';
            }

            updateDisplay();
        }

        function proceedToTokenSelection() {
            if (parseFloat(currentAmount) <= 0) return;

            // Haptic feedback
            if (navigator.vibrate) {
                navigator.vibrate(10);
            }

            // Save data
            localStorage.setItem('merchantName', merchantName);
            localStorage.setItem('amountTHB', currentAmount);

            // Navigate to token selection
            window.location.href = `select-token.html?amount=${currentAmount}&merchant=${encodeURIComponent(merchantName)}`;
        }

        // Initialize display
        updateDisplay();

        // Handle keyboard input (for desktop testing)
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') {
                addDigit(e.key);
            } else if (e.key === '.') {
                addDigit('.');
            } else if (e.key === 'Backspace') {
                e.preventDefault();
                deleteDigit();
            } else if (e.key === 'Enter') {
                proceedToTokenSelection();
            }
        });
    </script>
</body>
</html>
