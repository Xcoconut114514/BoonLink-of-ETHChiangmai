<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#EDEDED">
    <title>商家收款凭证 - BoonLink</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Language Switcher -->
        <div class="language-switcher">
            <button class="lang-btn active" data-lang="zh" onclick="switchLanguage('zh')">中文</button>
            <button class="lang-btn" data-lang="en" onclick="switchLanguage('en')">English</button>
            <button class="lang-btn" data-lang="th" onclick="switchLanguage('th')">ไทย</button>
        </div>

        <!-- Logo & Success Header -->
        <div class="merchant-header">
            <img src="assets/logo.png" alt="BoonLink" class="merchant-logo">
            <div class="merchant-brand">BoonLink</div>
            <div class="merchant-status" data-i18n="paymentReceived">收款成功</div>
        </div>

        <!-- Amount Display -->
        <div class="amount-display-large">
            <div class="amount-value-xl" id="amountTHB">฿40.00</div>
            <div class="amount-currency-label" data-i18n="thb">泰铢</div>
        </div>

        <!-- Payment Details -->
        <div class="app-content" style="padding-top: 0;">
            <div class="details-list">
                <div class="detail-item">
                    <span class="detail-label" data-i18n="payer">付款人</span>
                    <span class="detail-value" id="payerAddress">0x1a2b...3c4d</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label" data-i18n="paymentMethod">支付方式</span>
                    <span class="detail-value" id="paymentMethod">USDT (BSC)</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label" data-i18n="paymentAmount">支付金额</span>
                    <span class="detail-value" id="amountCrypto">1.13 USDT</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label" data-i18n="time">时间</span>
                    <span class="detail-value" id="timestamp">2025-01-30<br>14:30:25</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label" data-i18n="orderId">订单号</span>
                    <span class="detail-value" id="orderId">BL20250130001</span>
                </div>
            </div>

            <!-- Voice Announcement Button -->
            <button class="btn btn-secondary btn-large voice-btn" onclick="playVoiceAnnouncement()">
                <span class="voice-icon">🔊</span>
                <span data-i18n="voiceAnnouncement">语音播报</span>
            </button>

            <!-- New Payment Button -->
            <button class="btn btn-primary btn-large" onclick="newPayment()">
                <span data-i18n="newPayment">新的支付</span>
            </button>

            <!-- Back to Home -->
            <div style="text-align: center; margin-top: 24px;">
                <a href="index.html" class="back-link">
                    <span data-i18n="backToHome">返回首页</span>
                </a>
            </div>

            <!-- Powered by -->
            <div class="powered-by">
                <span>Powered by</span>
                <img src="assets/logo.png" alt="BoonLink" class="powered-logo">
                <span>BoonLink</span>
            </div>
        </div>
    </div>

    <style>
        .merchant-header {
            text-align: center;
            padding: 32px 20px 24px;
            background: linear-gradient(135deg, #667EEA 0%, #07C160 100%);
            color: white;
        }

        .merchant-logo {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .merchant-brand {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .merchant-status {
            font-size: 15px;
            opacity: 0.95;
        }

        .amount-display-large {
            text-align: center;
            padding: 32px 20px;
            background: var(--bg-card);
            margin: 16px;
            border-radius: 16px;
            box-shadow: var(--shadow-card);
        }

        .amount-value-xl {
            font-size: 56px;
            font-weight: 300;
            color: var(--text-primary);
            letter-spacing: -2px;
            line-height: 1;
        }

        .amount-currency-label {
            font-size: 16px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        .voice-btn {
            margin-top: 24px;
            margin-bottom: 12px;
        }

        .voice-icon {
            font-size: 20px;
            margin-right: 8px;
        }

        .back-link {
            color: var(--text-secondary);
            font-size: 14px;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:active {
            color: var(--text-primary);
        }

        .powered-by {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 32px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .powered-logo {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }
    </style>

    <script>
        // Translations
        const translations = {
            zh: {
                paymentReceived: '收款成功',
                thb: '泰铢',
                payer: '付款人',
                paymentMethod: '支付方式',
                paymentAmount: '支付金额',
                time: '时间',
                orderId: '订单号',
                voiceAnnouncement: '语音播报',
                newPayment: '新的支付',
                backToHome: '返回首页',
                voiceText: '收到付款 {amount} 泰铢'
            },
            en: {
                paymentReceived: 'Payment Received',
                thb: 'Thai Baht',
                payer: 'Payer',
                paymentMethod: 'Payment Method',
                paymentAmount: 'Payment Amount',
                time: 'Time',
                orderId: 'Order ID',
                voiceAnnouncement: 'Voice Announcement',
                newPayment: 'New Payment',
                backToHome: 'Back to Home',
                voiceText: 'Received payment {amount} Thai Baht'
            },
            th: {
                paymentReceived: 'ชำระเงินสำเร็จ',
                thb: 'บาท',
                payer: 'ผู้จ่าย',
                paymentMethod: 'วิธีการชำระเงิน',
                paymentAmount: 'จำนวนเงิน',
                time: 'เวลา',
                orderId: 'หมายเลขคำสั่งซื้อ',
                voiceAnnouncement: 'ประกาศด้วยเสียง',
                newPayment: 'การชำระเงินใหม่',
                backToHome: 'กลับหน้าแรก',
                voiceText: 'ได้รับเงิน {amount} บาท'
            }
        };

        let currentLang = 'zh';

        // Get payment data
        const amountTHB = parseFloat(localStorage.getItem('amountTHB')) || 40;
        const selectedToken = localStorage.getItem('selectedToken') || 'USDT';
        const amountCrypto = parseFloat(localStorage.getItem('amountCrypto')) || 1.13;
        const txHash = localStorage.getItem('txHash') || '0x1a2b...3c4d';
        const timestamp = localStorage.getItem('timestamp') || '2025-01-30 14:30:25';
        const orderId = localStorage.getItem('orderId') || 'BL20250130001';

        // Update display
        document.getElementById('amountTHB').textContent = `฿${amountTHB.toFixed(2)}`;
        document.getElementById('payerAddress').textContent = txHash.substring(0, 10) + '...';
        document.getElementById('paymentMethod').textContent = `${selectedToken} (BSC)`;

        const cryptoFormatted = selectedToken === 'ETH'
            ? amountCrypto.toFixed(6)
            : amountCrypto.toFixed(2);
        document.getElementById('amountCrypto').textContent = `${cryptoFormatted} ${selectedToken}`;

        document.getElementById('timestamp').innerHTML = timestamp.replace(' ', '<br>');
        document.getElementById('orderId').textContent = orderId;

        function switchLanguage(lang) {
            // Haptic feedback
            if (navigator.vibrate) {
                navigator.vibrate(5);
            }

            currentLang = lang;

            // Update language buttons
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-lang="${lang}"]`).classList.add('active');

            // Update all translatable elements
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
        }

        function playVoiceAnnouncement() {
            // Haptic feedback
            if (navigator.vibrate) {
                navigator.vibrate([50, 30, 50]);
            }

            const voiceText = translations[currentLang].voiceText.replace('{amount}', amountTHB.toFixed(2));

            // Use Speech Synthesis API
            if ('speechSynthesis' in window) {
                // Cancel any ongoing speech
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(voiceText);

                // Set language
                if (currentLang === 'zh') {
                    utterance.lang = 'zh-CN';
                } else if (currentLang === 'th') {
                    utterance.lang = 'th-TH';
                } else {
                    utterance.lang = 'en-US';
                }

                utterance.rate = 0.9;
                utterance.pitch = 1.0;
                utterance.volume = 1.0;

                window.speechSynthesis.speak(utterance);
            } else {
                alert(voiceText);
            }
        }

        function newPayment() {
            // Haptic feedback
            if (navigator.vibrate) {
                navigator.vibrate(10);
            }

            // Clear payment data
            localStorage.removeItem('amountTHB');
            localStorage.removeItem('selectedToken');
            localStorage.removeItem('amountCrypto');
            localStorage.removeItem('txHash');
            localStorage.removeItem('timestamp');
            localStorage.removeItem('orderId');
            localStorage.removeItem('amountFromQR');
            localStorage.removeItem('scannedQR');

            // Go to scan page
            window.location.href = 'scan.html';
        }

        // Auto-play voice on load (optional - uncomment to enable)
        // window.addEventListener('load', () => {
        //     setTimeout(playVoiceAnnouncement, 500);
        // });
    </script>
</body>
</html>
