<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#EDEDED">
    <title>选择支付方式 - BoonLink</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="app-header">
            <div class="header-left">
                <button class="icon-btn" onclick="goBack()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                </button>
            </div>
            <div class="header-title">选择支付方式</div>
            <div class="header-right"></div>
        </div>

        <!-- Content -->
        <div class="app-content">
            <!-- Merchant & Amount Info -->
            <div class="card">
                <div class="payment-summary">
                    <div class="payment-summary-label">付款给</div>
                    <div class="payment-summary-merchant" id="merchantName">PromptPay 商户</div>
                    <div class="payment-summary-amount" id="amountTHB">฿40.00</div>
                    <div class="payment-summary-currency">THB</div>
                </div>
            </div>

            <!-- Token List -->
            <div class="section-title">选择加密货币</div>
            <div class="token-list">
                <div class="token-item selected" data-token="USDT" onclick="selectToken('USDT')">
                    <div class="token-icon" style="background: linear-gradient(135deg, #26A17B 0%, #1E8F6E 100%);">
                        <span style="color: white; font-size: 18px; font-weight: 700;">₮</span>
                    </div>
                    <div class="token-info">
                        <div class="token-symbol">USDT</div>
                        <div class="token-name">Tether USD</div>
                    </div>
                    <div class="token-amount">
                        <div class="token-converted" id="usdt-amount">≈ 1.13 USDT</div>
                        <div class="token-balance">余额: 100.00</div>
                    </div>
                    <div class="token-check">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--accent-green)">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                        </svg>
                    </div>
                </div>

                <div class="token-item" data-token="USDC" onclick="selectToken('USDC')">
                    <div class="token-icon" style="background: linear-gradient(135deg, #2775CA 0%, #1A5FB4 100%);">
                        <span style="color: white; font-size: 18px; font-weight: 700;">$</span>
                    </div>
                    <div class="token-info">
                        <div class="token-symbol">USDC</div>
                        <div class="token-name">USD Coin</div>
                    </div>
                    <div class="token-amount">
                        <div class="token-converted" id="usdc-amount">≈ 1.13 USDC</div>
                        <div class="token-balance">余额: 50.00</div>
                    </div>
                    <div class="token-check">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--accent-green)">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                        </svg>
                    </div>
                </div>

                <div class="token-item" data-token="ETH" onclick="selectToken('ETH')">
                    <div class="token-icon" style="background: linear-gradient(135deg, #627EEA 0%, #454A75 100%);">
                        <span style="color: white; font-size: 16px;">◆</span>
                    </div>
                    <div class="token-info">
                        <div class="token-symbol">ETH</div>
                        <div class="token-name">Ethereum</div>
                    </div>
                    <div class="token-amount">
                        <div class="token-converted" id="eth-amount">≈ 0.00033 ETH</div>
                        <div class="token-balance">余额: 0.50</div>
                    </div>
                    <div class="token-check">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--accent-green)">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Network Info -->
            <div class="network-badge">
                <span class="network-icon">⚡</span>
                <span>BSC Network · Gas 费 < $0.01</span>
            </div>

            <!-- Exchange Rate Info -->
            <div class="hint">
                <span class="hint-icon">💡</span>
                <span class="hint-text">汇率每 5 分钟更新，支付时实时锁定。BoonLink 提供优惠汇率。</span>
            </div>
        </div>

        <!-- Fixed Bottom Button -->
        <div class="app-footer">
            <button class="btn btn-primary btn-large" id="confirmButton" onclick="proceedToPayment()">
                <span id="buttonText">确认支付 1.13 USDT</span>
                <div id="buttonSpinner" class="btn-spinner hidden"></div>
            </button>
        </div>
    </div>

    <style>
        .payment-summary {
            text-align: center;
            padding: 16px 0;
        }
        .payment-summary-label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .payment-summary-merchant {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 16px;
        }
        .payment-summary-amount {
            font-size: 40px;
            font-weight: 300;
            color: var(--text-primary);
            letter-spacing: -2px;
        }
        .payment-summary-currency {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .section-title {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
            margin: 20px 0 12px;
            padding-left: 4px;
        }

        .token-item {
            position: relative;
        }

        .token-check {
            opacity: 0;
            transition: opacity 0.2s;
            margin-left: 8px;
        }

        .token-item.selected .token-check {
            opacity: 1;
        }

        .network-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: rgba(7, 193, 96, 0.1);
            border-radius: 20px;
            font-size: 13px;
            color: var(--accent-green);
            margin-top: 16px;
        }

        .network-icon {
            font-size: 14px;
        }

        .btn-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .app-footer {
            padding-bottom: calc(16px + env(safe-area-inset-bottom, 0));
        }
    </style>

    <script>
        // Exchange rates (THB per token)
        const rates = {
            USDT: 35.40,  // 1 USDT = 35.40 THB (with discount)
            USDC: 35.40,  // 1 USDC = 35.40 THB
            ETH: 120000,  // 1 ETH = 120,000 THB
        };

        // Get amount from localStorage
        const amountTHB = parseFloat(localStorage.getItem('amountTHB')) || 40;
        const merchantName = localStorage.getItem('merchantName') || 'PromptPay 商户';

        let selectedToken = 'USDT';

        // Update display
        document.getElementById('amountTHB').textContent = `฿${amountTHB.toFixed(2)}`;
        document.getElementById('merchantName').textContent = merchantName;

        // Calculate and display token amounts
        function updateTokenAmounts() {
            // USDT
            const usdtAmount = amountTHB / rates.USDT;
            document.getElementById('usdt-amount').textContent = `≈ ${usdtAmount.toFixed(2)} USDT`;

            // USDC
            const usdcAmount = amountTHB / rates.USDC;
            document.getElementById('usdc-amount').textContent = `≈ ${usdcAmount.toFixed(2)} USDC`;

            // ETH
            const ethAmount = amountTHB / rates.ETH;
            document.getElementById('eth-amount').textContent = `≈ ${ethAmount.toFixed(6)} ETH`;
        }

        function selectToken(token) {
            // Haptic feedback
            if (navigator.vibrate) {
                navigator.vibrate(5);
            }

            selectedToken = token;

            // Update UI
            document.querySelectorAll('.token-item').forEach(item => {
                item.classList.remove('selected');
            });
            document.querySelector(`[data-token="${token}"]`).classList.add('selected');

            // Update button text
            const amount = amountTHB / rates[token];
            let formatted;

            if (token === 'ETH') {
                formatted = amount.toFixed(6);
            } else {
                formatted = amount.toFixed(2);
            }

            document.getElementById('buttonText').textContent = `确认支付 ${formatted} ${token}`;

            // Save selection
            localStorage.setItem('selectedToken', token);
        }

        function proceedToPayment() {
            // Haptic feedback
            if (navigator.vibrate) {
                navigator.vibrate(10);
            }

            const amount = amountTHB / rates[selectedToken];

            // Save payment data
            localStorage.setItem('amountTHB', amountTHB);
            localStorage.setItem('merchantName', merchantName);
            localStorage.setItem('selectedToken', selectedToken);
            localStorage.setItem('amountCrypto', amount.toFixed(selectedToken === 'ETH' ? 6 : 2));
            localStorage.setItem('exchangeRate', rates[selectedToken]);

            // Show loading state
            const button = document.getElementById('confirmButton');
            const buttonText = document.getElementById('buttonText');
            const buttonSpinner = document.getElementById('buttonSpinner');

            buttonText.textContent = '处理中...';
            buttonSpinner.classList.remove('hidden');
            button.disabled = true;
            button.style.opacity = '0.8';

            setTimeout(() => {
                window.location.href = 'success.html';
            }, 1500);
        }

        function goBack() {
            if (navigator.vibrate) {
                navigator.vibrate(5);
            }
            window.location.href = 'amount.html';
        }

        // Initialize
        updateTokenAmounts();

        // Restore previous selection if exists
        const savedToken = localStorage.getItem('selectedToken');
        if (savedToken && ['USDT', 'USDC', 'ETH'].includes(savedToken)) {
            selectToken(savedToken);
        }
    </script>
</body>
</html>
