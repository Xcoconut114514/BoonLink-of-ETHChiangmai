<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#191919">
    <title>BoonLink 商家端</title>
    <link rel="stylesheet" href="/shared/css/wechat-dark.css">
    <link rel="icon" href="/shared/assets/logo.png" type="image/png">
    <style>
        .home-container {
            min-height: 100vh;
            background: linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 100%);
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        /* Header */
        .home-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--bg-primary);
        }
        .home-header-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
        }
        /* Language Switcher */
        .lang-switcher {
            display: flex;
            gap: 4px;
            background: var(--bg-card);
            padding: 3px;
            border-radius: 8px;
        }
        .lang-btn {
            padding: 5px 10px;
            border: none;
            background: transparent;
            color: var(--text-tertiary);
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lang-btn.active {
            background: #FF9500;
            color: white;
        }
        
        /* Logo Section */
        .home-logo {
            text-align: center;
            padding: 8px 20px 16px;
        }
        .home-logo-img {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            margin-bottom: 10px;
        }
        .home-logo-text {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .home-logo-sub {
            font-size: 12px;
            color: #FF9500;
        }
        .home-logo-badge {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 10px;
            background: rgba(255, 149, 0, 0.15);
            border: 1px solid rgba(255, 149, 0, 0.3);
            border-radius: 16px;
            font-size: 11px;
            color: #FF9500;
        }
        
        /* Voice Banner */
        .voice-banner {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0 16px 16px;
            padding: 16px;
            background: linear-gradient(135deg, #1a2a1a 0%, #0d1a0d 100%);
            border: 2px solid #07C160;
            border-radius: 12px;
            cursor: pointer;
            animation: pulse 2s infinite;
        }
        .voice-banner:active {
            transform: scale(0.98);
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(7, 193, 96, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(7, 193, 96, 0); }
        }
        .voice-banner-icon {
            font-size: 32px;
        }
        .voice-banner-text {
            flex: 1;
        }
        .voice-banner-title {
            font-size: 16px;
            font-weight: 600;
            color: #07C160;
        }
        .voice-banner-desc {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .voice-banner-btn {
            padding: 8px 16px;
            background: #07C160;
            color: white;
            font-weight: 600;
            border-radius: 8px;
        }
        .voice-status {
            text-align: center;
            padding: 10px 16px;
            margin: 0 16px 16px;
            background: rgba(7, 193, 96, 0.1);
            border-radius: 8px;
            font-size: 13px;
            color: #07C160;
        }
        
        /* Stats Card */
        .stats-card {
            margin: 0 16px 16px;
            padding: 20px;
            background: var(--bg-secondary);
            border-radius: 12px;
        }
        .stats-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .stats-title {
            font-size: 14px;
            color: var(--text-secondary);
        }
        .stats-period {
            font-size: 12px;
            color: var(--text-tertiary);
        }
        .stats-row {
            display: flex;
            gap: 20px;
        }
        .stats-item {
            flex: 1;
            text-align: center;
        }
        .stats-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .stats-value.green { color: var(--accent-green); }
        .stats-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        
        /* Action Buttons */
        .action-section {
            padding: 0 16px;
        }
        .action-btn {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 16px;
            margin-bottom: 12px;
            background: var(--bg-secondary);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
        }
        .action-btn:active {
            background: var(--bg-card);
        }
        .action-btn-icon {
            width: 44px;
            height: 44px;
            background: var(--accent-green);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-right: 14px;
        }
        .action-btn-icon.orange { background: #FF9500; }
        .action-btn-icon.blue { background: #007AFF; }
        .action-btn-icon.purple { background: #AF52DE; }
        .action-btn-content {
            flex: 1;
            text-align: left;
        }
        .action-btn-title {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
        }
        .action-btn-desc {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .action-btn-arrow {
            color: var(--text-tertiary);
            font-size: 20px;
        }
        
        /* Quick Actions */
        .quick-section {
            margin: 20px 16px 0;
        }
        .quick-title {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            padding-left: 4px;
        }
        .quick-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .quick-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 16px 8px;
            background: var(--bg-secondary);
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
        }
        .quick-item:active {
            background: var(--bg-card);
        }
        .quick-icon {
            font-size: 26px;
        }
        .quick-label {
            font-size: 12px;
            color: var(--text-primary);
        }
        
        /* Footer */
        .home-footer {
            text-align: center;
            padding: 30px 16px;
            color: var(--text-tertiary);
            font-size: 12px;
        }
        .home-footer-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(7, 193, 96, 0.1);
            border-radius: 20px;
            margin-bottom: 10px;
        }
        .home-footer-badge svg {
            width: 14px;
            height: 14px;
        }
        .home-footer-badge span {
            color: var(--accent-green);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="home-container">
        <!-- Header -->
        <div class="home-header">
            <div></div>
            <div></div>
            <div class="lang-switcher">
                <button class="lang-btn active" data-lang="zh" onclick="setLang('zh')">中</button>
                <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
                <button class="lang-btn" data-lang="th" onclick="setLang('th')">ไทย</button>
            </div>
        </div>

        <!-- Logo -->
        <div class="home-logo">
            <img src="/shared/assets/logo.png" alt="BoonLink" class="home-logo-img">
            <div class="home-logo-text">BoonLink</div>
            <div class="home-logo-sub">商家收款</div>
            <div class="home-logo-badge">🏪 Merchant Portal</div>
        </div>

        <!-- Voice Enable Banner -->
        <div id="voiceBanner" class="voice-banner" onclick="enableVoice()">
            <div class="voice-banner-icon">🔊</div>
            <div class="voice-banner-text">
                <div class="voice-banner-title">点击开启语音播报</div>
                <div class="voice-banner-desc">收款到账将自动播报泰语语音</div>
            </div>
            <div class="voice-banner-btn">开启</div>
        </div>

        <!-- Voice Status (shown after enabled) -->
        <div id="voiceStatus" class="voice-status" style="display: none;">
            <span>🔊 语音已开启 · 监听中...</span>
        </div>

        <!-- Stats Card -->
        <div class="stats-card">
            <div class="stats-header">
                <span class="stats-title">收款统计</span>
                <span class="stats-period">今日</span>
            </div>
            <div class="stats-row">
                <div class="stats-item">
                    <div class="stats-value green" id="todayAmount">฿0</div>
                    <div class="stats-label">收款金额</div>
                </div>
                <div class="stats-item">
                    <div class="stats-value" id="todayCount">0</div>
                    <div class="stats-label">交易笔数</div>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-section">
            <a href="/merchant/receive.html" class="action-btn">
                <div class="action-btn-icon">📷</div>
                <div class="action-btn-content">
                    <div class="action-btn-title">扫码收款</div>
                    <div class="action-btn-desc">扫描客户付款码收款</div>
                </div>
                <span class="action-btn-arrow">›</span>
            </a>
            <a href="/merchant/qrcode.html" class="action-btn">
                <div class="action-btn-icon orange">🔳</div>
                <div class="action-btn-content">
                    <div class="action-btn-title">收款码</div>
                    <div class="action-btn-desc">展示 PromptPay 收款码</div>
                </div>
                <span class="action-btn-arrow">›</span>
            </a>
            <a href="/merchant/history.html" class="action-btn">
                <div class="action-btn-icon blue">📋</div>
                <div class="action-btn-content">
                    <div class="action-btn-title">收款记录</div>
                    <div class="action-btn-desc">查看历史收款明细</div>
                </div>
                <span class="action-btn-arrow">›</span>
            </a>
        </div>

        <!-- Quick Actions -->
        <div class="quick-section">
            <div class="quick-title">快捷功能</div>
            <div class="quick-grid">
                <a href="/merchant/settings.html" class="quick-item">
                    <span class="quick-icon">⚙️</span>
                    <span class="quick-label">设置</span>
                </a>
                <a href="/merchant/notify.html" class="quick-item">
                    <span class="quick-icon">🔔</span>
                    <span class="quick-label">通知</span>
                </a>
                <a href="/merchant/export.html" class="quick-item">
                    <span class="quick-icon">📊</span>
                    <span class="quick-label">导出</span>
                </a>
                <a href="/merchant/help.html" class="quick-item">
                    <span class="quick-icon">❓</span>
                    <span class="quick-label">帮助</span>
                </a>
            </div>
        </div>

        <!-- Footer -->
        <div class="home-footer">
            <div class="home-footer-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="#07C160" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                <span>Zero-Touch Crypto™</span>
            </div>
            <div>商家只看泰铢金额 · 自动结算</div>
            <div style="margin-top: 6px;">BoonLink © 2026</div>
        </div>
    </div>

    <script>
        // i18n translations
        const i18n = {
            zh: {
                headerTitle: '商家端',
                merchantReceive: '商家收款',
                merchantPortal: 'Merchant Portal',
                receiveStats: '收款统计',
                today: '今日',
                receiveAmount: '收款金额',
                txCount: '交易笔数',
                scanReceive: '扫码收款',
                scanReceiveDesc: '扫描客户付款码收款',
                qrCode: '收款码',
                qrCodeDesc: '展示 PromptPay 收款码',
                receiveHistory: '收款记录',
                receiveHistoryDesc: '查看历史收款明细',
                quickFeatures: '快捷功能',
                settings: '设置',
                notify: '通知',
                export: '导出',
                help: '帮助',
                zeroTouch: 'Zero-Touch Crypto™',
                merchantOnlyThb: '商家只看泰铢金额 · 自动结算'
            },
            en: {
                headerTitle: 'Merchant',
                merchantReceive: 'Merchant Receive',
                merchantPortal: 'Merchant Portal',
                receiveStats: 'Receiving Stats',
                today: 'Today',
                receiveAmount: 'Amount Received',
                txCount: 'Transactions',
                scanReceive: 'Scan to Receive',
                scanReceiveDesc: 'Scan customer payment QR',
                qrCode: 'QR Code',
                qrCodeDesc: 'Show PromptPay QR code',
                receiveHistory: 'Receive History',
                receiveHistoryDesc: 'View past receiving records',
                quickFeatures: 'Quick Features',
                settings: 'Settings',
                notify: 'Notify',
                export: 'Export',
                help: 'Help',
                zeroTouch: 'Zero-Touch Crypto™',
                merchantOnlyThb: 'Merchant sees THB only · Auto settlement'
            },
            th: {
                headerTitle: 'ร้านค้า',
                merchantReceive: 'รับเงินร้านค้า',
                merchantPortal: 'Merchant Portal',
                receiveStats: 'สถิติรับเงิน',
                today: 'วันนี้',
                receiveAmount: 'ยอดรับ',
                txCount: 'รายการ',
                scanReceive: 'สแกนรับเงิน',
                scanReceiveDesc: 'สแกน QR ลูกค้าเพื่อรับเงิน',
                qrCode: 'QR Code',
                qrCodeDesc: 'แสดง QR PromptPay',
                receiveHistory: 'ประวัติรับเงิน',
                receiveHistoryDesc: 'ดูรายการรับเงินที่ผ่านมา',
                quickFeatures: 'ฟีเจอร์ด่วน',
                settings: 'ตั้งค่า',
                notify: 'แจ้งเตือน',
                export: 'ส่งออก',
                help: 'ช่วยเหลือ',
                zeroTouch: 'Zero-Touch Crypto™',
                merchantOnlyThb: 'ร้านค้าเห็นแค่บาท · ชำระอัตโนมัติ'
            }
        };

        let currentLang = localStorage.getItem('boonlink_lang') || 'zh';

        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem('boonlink_lang', lang);
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            applyTranslations();
        }

        function t(key) {
            return i18n[currentLang]?.[key] || i18n['zh'][key] || key;
        }

        function applyTranslations() {
            document.querySelector('.home-logo-sub').textContent = t('merchantReceive');
            document.querySelector('.home-logo-badge').textContent = '🏪 ' + t('merchantPortal');
            document.querySelector('.stats-title').textContent = t('receiveStats');
            document.querySelector('.stats-period').textContent = t('today');
            
            const statsLabels = document.querySelectorAll('.stats-label');
            if (statsLabels[0]) statsLabels[0].textContent = t('receiveAmount');
            if (statsLabels[1]) statsLabels[1].textContent = t('txCount');
            
            const actionTitles = document.querySelectorAll('.action-btn-title');
            const actionDescs = document.querySelectorAll('.action-btn-desc');
            if (actionTitles[0]) actionTitles[0].textContent = t('scanReceive');
            if (actionDescs[0]) actionDescs[0].textContent = t('scanReceiveDesc');
            if (actionTitles[1]) actionTitles[1].textContent = t('qrCode');
            if (actionDescs[1]) actionDescs[1].textContent = t('qrCodeDesc');
            if (actionTitles[2]) actionTitles[2].textContent = t('receiveHistory');
            if (actionDescs[2]) actionDescs[2].textContent = t('receiveHistoryDesc');
            
            document.querySelector('.quick-title').textContent = t('quickFeatures');
            
            const quickLabels = document.querySelectorAll('.quick-label');
            if (quickLabels[0]) quickLabels[0].textContent = t('settings');
            if (quickLabels[1]) quickLabels[1].textContent = t('notify');
            if (quickLabels[2]) quickLabels[2].textContent = t('export');
            if (quickLabels[3]) quickLabels[3].textContent = t('help');
            
            document.querySelector('.home-footer-badge span').textContent = t('zeroTouch');
            const footerTexts = document.querySelectorAll('.home-footer > div');
            if (footerTexts[1]) footerTexts[1].textContent = t('merchantOnlyThb');
        }

        // Load stats from localStorage (demo)
        function loadStats() {
            const stats = JSON.parse(localStorage.getItem('merchantStats') || '{"amount":0,"count":0}');
            document.getElementById('todayAmount').textContent = '฿' + stats.amount.toLocaleString();
            document.getElementById('todayCount').textContent = stats.count;
        }
        
        // ============================================
        // Voice Enable - Required for browser autoplay policy
        // ============================================
        let voiceEnabled = false;
        
        function enableVoice() {
            // Play a test sound to unlock audio
            if ('speechSynthesis' in window) {
                const testUtterance = new SpeechSynthesisUtterance('');
                testUtterance.volume = 0;
                window.speechSynthesis.speak(testUtterance);
            }
            
            voiceEnabled = true;
            
            // Hide banner, show status
            document.getElementById('voiceBanner').style.display = 'none';
            document.getElementById('voiceStatus').style.display = 'block';
            
            // Play confirmation in Thai
            setTimeout(() => {
                playTestVoice();
            }, 300);
            
            console.log('✅ Voice enabled!');
        }
        
        async function playTestVoice() {
            if (!('speechSynthesis' in window)) return;
            
            let voices = window.speechSynthesis.getVoices();
            if (voices.length === 0) {
                await new Promise(resolve => {
                    window.speechSynthesis.onvoiceschanged = () => {
                        voices = window.speechSynthesis.getVoices();
                        resolve();
                    };
                    setTimeout(resolve, 500);
                });
            }
            
            const utterance = new SpeechSynthesisUtterance('BoonLink พร้อมรับเงิน');
            utterance.lang = 'th-TH';
            utterance.rate = 0.9;
            utterance.volume = 1.0;
            
            const thaiVoice = voices.find(v => v.lang.startsWith('th'));
            if (thaiVoice) utterance.voice = thaiVoice;
            
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }
        
        // ============================================
        // Blockchain Wallet Monitor - Watch for REAL on-chain payments
        // Monitors 0x6778404839E5D817c35ba72Fa5cD45a2716d9905 for transfers
        // ============================================
        let lastPollTime = Date.now() - 60000; // Start from 1 minute ago
        let pollingInterval = null;
        let processedHashes = new Set();
        
        function startOrderPolling() {
            console.log('🔄 Starting blockchain wallet monitor...');
            console.log('💰 Watching wallet: 0x6778404839E5D817c35ba72Fa5cD45a2716d9905');
            
            // Check immediately once
            checkBlockchainTransfers();
            
            // Then poll every 5 seconds (blockchain is slower)
            pollingInterval = setInterval(checkBlockchainTransfers, 5000);
        }
        
        async function checkBlockchainTransfers() {
            try {
                // Poll blockchain wallet monitor API
                const response = await fetch(`/api/watch-wallet?since=${lastPollTime}`);
                const data = await response.json();
                
                if (data.transfers && data.transfers.length > 0) {
                    for (const tx of data.transfers) {
                        // Skip already processed
                        if (processedHashes.has(tx.hash)) continue;
                        processedHashes.add(tx.hash);
                        
                        console.log('💰 Blockchain payment detected:', tx);
                        
                        // Update stats
                        const stats = JSON.parse(localStorage.getItem('merchantStats') || '{"amount":0,"count":0}');
                        stats.amount += tx.amountTHB || 0;
                        stats.count += 1;
                        localStorage.setItem('merchantStats', JSON.stringify(stats));
                        
                        // Refresh display
                        loadStats();
                        
                        // Play Thai voice: "BoonLink รับเงินแล้ว X บาท"
                        await playBlockchainVoice(tx.amountTHB, tx.token);
                        
                        // Show notification
                        showBlockchainNotification(tx);
                    }
                }
                
                // Update poll time
                lastPollTime = data.timestamp || Date.now();
                
            } catch (error) {
                console.error('❌ Blockchain monitor error:', error);
                // Fallback to order API
                checkOrdersAPI();
            }
        }
        
        // Fallback: Also check the order API
        async function checkOrdersAPI() {
            try {
                const response = await fetch(`/api/orders?since=${lastPollTime}&merchantId=`);
                const data = await response.json();
                
                if (data.orders && data.orders.length > 0) {
                    console.log('📥 Found orders from API:', data.orders.length);
                    
                    for (const order of data.orders) {
                        // Update stats
                        const stats = JSON.parse(localStorage.getItem('merchantStats') || '{"amount":0,"count":0}');
                        stats.amount += order.amountTHB || 0;
                        stats.count += 1;
                        localStorage.setItem('merchantStats', JSON.stringify(stats));
                        
                        // Refresh display
                        loadStats();
                        
                        // Play voice notification
                        await playReceiveVoice(order.amountTHB);
                        
                        // Show notification
                        showNewOrderNotification(order);
                    }
                }
                
                // Update poll time for next request
                lastPollTime = data.timestamp || Date.now();
                
            } catch (error) {
                console.error('❌ Order polling failed:', error);
            }
        }
        
        // Thai voice for blockchain payments: "BoonLink รับเงินแล้ว X บาท"
        async function playBlockchainVoice(amountTHB, token) {
            if (!voiceEnabled) {
                console.log('⚠️ Voice not enabled yet - user needs to tap the banner first');
                return;
            }
            if (!('speechSynthesis' in window)) return;
            
            // Wait for voices
            let voices = window.speechSynthesis.getVoices();
            if (voices.length === 0) {
                await new Promise(resolve => {
                    window.speechSynthesis.onvoiceschanged = () => {
                        voices = window.speechSynthesis.getVoices();
                        resolve();
                    };
                    setTimeout(resolve, 500);
                });
            }
            
            const formattedAmount = Math.round(amountTHB || 0);
            
            // Always use Thai for blockchain payments as requested
            const text = `BoonLink รับเงินแล้ว ${formattedAmount} บาท`;
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'th-TH';
            utterance.rate = 0.9;
            utterance.volume = 1.0;
            
            // Try to find Thai voice
            const thaiVoice = voices.find(v => v.lang.startsWith('th'));
            if (thaiVoice) utterance.voice = thaiVoice;
            
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
            
            console.log('🔊 Thai voice:', text);
            
            // Vibrate pattern
            if (navigator.vibrate) {
                navigator.vibrate([300, 100, 300, 100, 300]);
            }
        }
        
        function showBlockchainNotification(tx) {
            const toast = document.createElement('div');
            toast.innerHTML = `
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="font-size: 36px;">⛓️💰</div>
                    <div>
                        <div style="font-size: 18px; font-weight: 700; color: #07C160;">
                            ฿${(tx.amountTHB || 0).toLocaleString()} 到账！
                        </div>
                        <div style="font-size: 14px; color: #FF9500; margin-top: 4px;">
                            ${tx.amount} ${tx.token} (链上确认)
                        </div>
                        <div style="font-size: 11px; color: var(--text-tertiary); margin-top: 4px;">
                            ${tx.hash.slice(0, 10)}...${tx.hash.slice(-8)}
                        </div>
                    </div>
                </div>
            `;
            toast.style.cssText = `
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: linear-gradient(135deg, #1a2a1a 0%, #0d1a0d 100%);
                padding: 20px 24px;
                border-radius: 16px;
                box-shadow: 0 8px 32px rgba(7, 193, 96, 0.4);
                z-index: 10000;
                animation: slideDown 0.3s ease;
                border: 2px solid #07C160;
            `;
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideUp 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 6000);
        }
        
        async function playReceiveVoice(amount) {
            if (!('speechSynthesis' in window)) return;
            
            // Wait for voices
            let voices = window.speechSynthesis.getVoices();
            if (voices.length === 0) {
                await new Promise(resolve => {
                    window.speechSynthesis.onvoiceschanged = () => {
                        voices = window.speechSynthesis.getVoices();
                        resolve();
                    };
                    setTimeout(resolve, 500);
                });
            }
            
            const lang = currentLang || 'zh';
            const formattedAmount = Math.round(amount || 0);
            
            const voiceTexts = {
                zh: `收款到账 ${formattedAmount} 泰铢`,
                en: `Payment received. ${formattedAmount} Baht`,
                th: `รับเงินแล้ว ${formattedAmount} บาท`
            };
            
            const langCodes = { zh: 'zh-CN', en: 'en-US', th: 'th-TH' };
            
            const utterance = new SpeechSynthesisUtterance(voiceTexts[lang] || voiceTexts.zh);
            utterance.lang = langCodes[lang] || 'zh-CN';
            utterance.rate = 0.9;
            utterance.volume = 1.0;
            
            const langPrefix = (langCodes[lang] || 'zh-CN').split('-')[0];
            const voice = voices.find(v => v.lang.startsWith(langPrefix));
            if (voice) utterance.voice = voice;
            
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
            
            // Vibrate
            if (navigator.vibrate) {
                navigator.vibrate([200, 100, 200]);
            }
        }
        
        function showNewOrderNotification(order) {
            // Create toast notification
            const toast = document.createElement('div');
            toast.className = 'order-toast';
            toast.innerHTML = `
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="font-size: 32px;">💰</div>
                    <div>
                        <div style="font-size: 16px; font-weight: 600; color: #07C160;">
                            ${t('receiveAmount')}: ฿${(order.amountTHB || 0).toLocaleString()}
                        </div>
                        <div style="font-size: 13px; color: var(--text-secondary); margin-top: 4px;">
                            ${order.merchantName || 'PromptPay'}
                        </div>
                    </div>
                </div>
            `;
            toast.style.cssText = `
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: var(--bg-card);
                padding: 16px 20px;
                border-radius: 12px;
                box-shadow: 0 4px 20px rgba(0,0,0,0.3);
                z-index: 10000;
                animation: slideDown 0.3s ease;
                border: 1px solid #07C160;
            `;
            
            document.body.appendChild(toast);
            
            // Remove after 4 seconds
            setTimeout(() => {
                toast.style.animation = 'slideUp 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }
        
        // Add animation styles
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideDown {
                from { transform: translateX(-50%) translateY(-100%); opacity: 0; }
                to { transform: translateX(-50%) translateY(0); opacity: 1; }
            }
            @keyframes slideUp {
                from { transform: translateX(-50%) translateY(0); opacity: 1; }
                to { transform: translateX(-50%) translateY(-100%); opacity: 0; }
            }
        `;
        document.head.appendChild(style);

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === currentLang);
            });
            applyTranslations();
            loadStats();
            startOrderPolling();
        });
        
        // Clean up on page unload
        window.addEventListener('beforeunload', () => {
            if (pollingInterval) clearInterval(pollingInterval);
        });
    </script>
</body>
</html>
